- id: przejecie_urlopu_przez_ojca
  nazwa: Ojciec przejmuje część urlopu macierzyńskiego i zasiłku
  typ: uprawnienie
  instytucja: ZUS
  dla_kogo:
    rola:
    - oboje
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
    warunki:
    - Matka wykorzystała po porodzie co najmniej 14 tygodni zasiłku macierzyńskiego i rezygnuje z reszty.
    - Ojciec ma ubezpieczenie chorobowe. Na etacie bierze resztę urlopu macierzyńskiego; na zleceniu albo z działalnością
      musi przerwać pracę zarobkową, żeby opiekować się dzieckiem.
    - Ojciec przejmuje zasiłek od dnia następnego po rezygnacji matki. Łączny okres obojga nie może przekroczyć
      20, 31, 33, 35 albo 37 tygodni.
    - Już po 8 tygodniach ojciec może przejąć zasiłek, gdy matka leży w szpitalu (tylko na czas jej pobytu), ma
      orzeczenie o niezdolności do samodzielnej egzystencji albo porzuciła dziecko. Może go wtedy przejąć także
      inny ubezpieczony członek najbliższej rodziny.
    - Gdy matka umrze, ojciec albo inny ubezpieczony członek najbliższej rodziny dostaje zasiłek za pozostały okres.
    - Gdy nieubezpieczona matka podejmie pracę na co najmniej pół etatu, ubezpieczony ojciec może pobierać zasiłek
      od tego dnia do końca wymiaru liczonego od porodu.
  etap: do_3_miesiecy
  termin:
    od: porod
    limit: Matka na etacie – wniosek o rezygnację z urlopu najpóźniej 7 dni przed powrotem do pracy. Ojciec na etacie
      – wniosek o urlop najpóźniej 14 dni przed jego początkiem. Pracodawcy muszą oba wnioski uwzględnić.
    skutek_spoznienia: null
  kwota:
    opis: Zasiłek macierzyński za pozostałą część urlopu macierzyńskiego. Ojciec przedstawia zaświadczenie o stawce
      procentowej, w jakiej zasiłek pobierała matka.
    okres: Część urlopu macierzyńskiego, która została po rezygnacji matki.
  jak_zlozyc:
    kanaly:
    - pracodawca
    - zleceniodawca
    - PUE/eZUS
    uwagi: 'Matka składa oświadczenie, od kiedy ojciec przejmie zasiłek; poza etatem – pisemny wniosek z datą rezygnacji.
      Ojciec dołącza zaświadczenie płatnika zasiłku matki (okres pobierania, okres przysługujący i stawka procentowa),
      dane dziecka i dane matki. Formularze ZUS: ZAS-23 (wniosek o skrócenie lub wstrzymanie okresu wypłaty zasiłku
      macierzyńskiego), ZAM (wniosek o zasiłek macierzyński), ZAS-24 (zaświadczenie o okresach wypłaconego lub przysługującego
      zasiłku macierzyńskiego).'
  powiazane:
  - zasilek_macierzynski_urlop_macierzynski
  - zasilek_opiekunczy
  zrodlo:
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/prawo-do-zasilku-i-okres-przyslugiwania/za-okres-urlopu-macierzynskiego-albo-urlopu-na-warunkach-urlopu-macierzynskiego
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/niezbedne-dokumenty
  - https://www.zus.pl/wzory-formularzy/zasilki/zasilek-macierzynski
  - https://api.sejm.gov.pl/eli/acts/DU/1999/636/text/U/D19990636Lj.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/1974/141/text/U/D19740141Lj.pdf
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Lista formularzy ZUS nie mówi wprost, który formularz składa ojciec i kto wystawia ZAS-24 – przypisanie wynika
    z nazw formularzy.
  - Stawka dla ojca (100% czy 81,5%) i to, czy zasiłek liczy się od podstawy wymiaru ojca – źródła nie mówią tego
    wprost; wiadomo tylko, że ojciec przedstawia stawkę procentową matki.
  - Terminy dla matki i ojca spoza etatu (zlecenie, działalność) – źródła podają je tylko dla pracowników.
- id: zasilek_po_ustaniu_ubezpieczenia
  nazwa: Umowa kończy się w ciąży – zasiłek macierzyński po ustaniu ubezpieczenia
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    warunki:
    - Zasiłek macierzyński dostaje osoba, która w dniu porodu ma ubezpieczenie chorobowe. Wyjątki od tej zasady
      są wymienione niżej.
    - Umowa o pracę na czas określony albo na okres próbny dłuższy niż miesiąc, która skończyłaby się po upływie
      3. miesiąca ciąży, przedłuża się z mocy prawa do dnia porodu. Po porodzie zasiłek macierzyński wypłaca ZUS.
    - Przedłużenie nie dotyczy umowy na zastępstwo nieobecnego pracownika ani okresu próbnego do miesiąca.
    - Pracodawca zmarł, ogłosił upadłość albo został zlikwidowany, a pracownicy w ciąży nie zapewniono innej pracy
      – do dnia porodu przysługuje „zasiłek w wysokości zasiłku macierzyńskiego”, a od porodu zasiłek macierzyński.
    - Zwolnienie z pracy w ciąży z naruszeniem prawa, stwierdzone prawomocnym wyrokiem sądu – zasiłek macierzyński
      przysługuje mimo ustania ubezpieczenia.
    - Zlecenie, które kończy się w ciąży, nie przedłuża się do porodu i ustawa nie daje wtedy zasiłku macierzyńskiego
      po ustaniu ubezpieczenia. Bez ubezpieczenia chorobowego w dniu porodu zostaje świadczenie rodzicielskie z
      gminy.
    - Zwolnienie lekarskie rozpoczęte przed końcem umowy – zasiłek chorobowy przysługuje dalej po ustaniu ubezpieczenia,
      a w ciąży nie obowiązuje limit 91 dni. Nie przysługuje, gdy przed końcem umowy nie minął okres wyczekiwania,
      gdy podejmiesz inną pracę dającą ubezpieczenie chorobowe albo masz prawo do zasiłku dla bezrobotnych.
  etap: ciaza
  termin:
    od: porod
    limit: 6 miesięcy od ostatniego dnia okresu, za który zasiłek przysługuje
    skutek_spoznienia: Po tym terminie zasiłek przepada (roszczenie się przedawnia).
  kwota:
    opis: Zasiłek macierzyński na zwykłych zasadach – 100% podstawy wymiaru za okres urlopu macierzyńskiego albo
      81,5% po złożeniu wniosku w 21 dni po porodzie. Zasiłek w wysokości zasiłku macierzyńskiego (do dnia porodu)
      – 100% podstawy wymiaru, bez dopłaty do 1000 zł.
    okres: Jak przy urlopie macierzyńskim (20–37 tygodni). Zasiłek za okres urlopu rodzicielskiego także, jeśli
      następuje bezpośrednio po macierzyńskim.
  jak_zlozyc:
    kanaly:
    - PUE/eZUS
    - placówka ZUS
    uwagi: Zasiłki za okres po ustaniu ubezpieczenia zawsze wypłaca ZUS. Zasiłek w wysokości zasiłku macierzyńskiego
      – wniosek ZAS-55, zaświadczenie lekarskie (zwykły druk) o ciąży w czasie zatrudnienia, świadectwo pracy albo
      inny dokument o przyczynie rozwiązania umowy, oświadczenie, że nie zapewniono innej pracy. Zasiłek macierzyński
      po porodzie – wniosek o zasiłek macierzyński (formularz ZAM), zaświadczenie o ciąży w czasie zatrudnienia,
      świadectwo pracy albo prawomocny wyrok sądu, dane dziecka. Wniosek o zasiłek za okres urlopu rodzicielskiego
      trzeba złożyć przed pierwszym dniem tego okresu.
  powiazane:
  - zasilek_macierzynski_urlop_macierzynski
  - zasilek_chorobowy_w_ciazy
  - swiadczenie_rodzicielskie
  zrodlo:
  - https://api.sejm.gov.pl/eli/acts/DU/1974/141/text/U/D19740141Lj.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/1999/636/text/U/D19990636Lj.pdf
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/prawo-do-zasilku-i-okres-przyslugiwania/za-okres-urlopu-macierzynskiego-albo-urlopu-na-warunkach-urlopu-macierzynskiego
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/niezbedne-dokumenty
  - https://www.zus.pl/wzory-formularzy/zasilki/zasilek-macierzynski
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/wysokosc
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-chorobowy/z-ubezpieczenia-chorobowego/prawo-do-zasilku-i-okres-przyslugiwania
  - https://www.zus.pl/documents/10182/167567/1184_26+Poradnik+dla+rodzic%C3%B3w.pdf/9378de60-151e-9b9f-ba65-abdf41d9f5b4
  - https://www.zus.pl/documents/10182/24202/Komentarz+do+ustawy+o+%C5%9Bwiadczeniach+pieni%C4%99%C5%BCnych+z+ubezpieczenia+spo%C5%82ecznego+w+razie+choroby+i+macierzy%C5%84stwa+kwiecie%C5%84+2022.pdf/7a31a278-8c06-cee4-3542-1d5bb8b36ad6
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Zlecenie kończące się w ciąży – wniosek z zamkniętej listy w art. 30 ustawy i z warunku ubezpieczenia w dniu
    porodu; ZUS nie opisuje tego przypadku wprost. Potwierdzić w ZUS (mama@zus.pl, infolinia 22 560 16 00).
  - Stawka 100% zasiłku w wysokości zasiłku macierzyńskiego oraz prawo do zasiłku za okres urlopu rodzicielskiego
    po ustaniu ubezpieczenia – z Komentarza ZUS z 2023 r. (pkt 103 i 134).
  - Czy podstawa wymiaru zasiłku macierzyńskiego po ustaniu ubezpieczenia jest ograniczona do 100% przeciętnego
    wynagrodzenia – strona ZUS o podstawie wymiaru tak podaje, ale art. 47 i 52 ustawy nie odsyłają do art. 46.
    Sprzeczność do wyjaśnienia.
  - Czy pobieranie zasiłku chorobowego po ustaniu zlecenia daje w dniu porodu prawo do zasiłku macierzyńskiego (z
    przepisów wynika, że nie – nie potwierdzono w ZUS).
- id: jdg_dobrowolne_chorobowe
  nazwa: Dobrowolne ubezpieczenie chorobowe przy działalności gospodarczej – warunek zasiłków
  typ: decyzja
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    - ojciec
    status_zawodowy:
    - jdg_bez_chorobowego
    - jdg_z_chorobowym
    warunki:
    - Do ubezpieczenia chorobowego może przystąpić tylko osoba, która z działalności obowiązkowo opłaca składki
      emerytalne i rentowe. Na „uldze na start” nie ma takiej możliwości.
    - Nie można zgłosić się wstecz. Ubezpieczenie działa od dnia wskazanego w zgłoszeniu ZUS ZUA, nie wcześniej
      niż od dnia jego złożenia.
    - Wyjątek – zgłoszenie złożone w ciągu 7 dni od rozpoczęcia działalności obejmuje ubezpieczeniem od pierwszego
      dnia działalności.
    - Zasiłek macierzyński nie ma okresu wyczekiwania. Przysługuje nawet wtedy, gdy dziecko urodzi się dzień po
      zgłoszeniu do ubezpieczenia.
    - Zasiłek chorobowy ma okres wyczekiwania 90 dni – także w ciąży.
    - Zaległość w składkach powyżej 1% minimalnego wynagrodzenia wstrzymuje zasiłek. Po spłacie całości w ciągu
      6 miesięcy ZUS wypłaci go za cały okres; później prawo przepada.
    - ZUS może sprawdzić, czy działalność była faktycznie prowadzona. Jeśli nie – wyda decyzję o niepodleganiu ubezpieczeniom.
    - W czasie zasiłku macierzyńskiego matka nie musi zawieszać działalności. Obowiązek przerwania pracy zarobkowej
      dotyczy ojca, który przejmuje zasiłek po matce.
  etap: planowanie
  termin:
    od: null
    limit: Zgłoszenie ZUS ZUA przed dniem porodu – ubezpieczenie musi trwać w dniu porodu.
    skutek_spoznienia: Brak zasiłku macierzyńskiego. Zostaje świadczenie rodzicielskie z gminy – 1000 zł miesięcznie.
  kwota:
    skladka: 2,45% zadeklarowanej podstawy wymiaru; podstawa składki chorobowej nie może przekroczyć 250% prognozowanego
      przeciętnego wynagrodzenia miesięcznie.
    podstawa_zasilku: Przeciętna miesięczna kwota, od której opłacano składkę chorobową, z 12 miesięcy kalendarzowych
      przed miesiącem powstania prawa do zasiłku, pomniejszona o 13,71%. Jeśli zasiłek macierzyński następuje po
      zasiłku chorobowym bez przerwy albo z przerwą krótszą niż miesiąc kalendarzowy, podstawy nie liczy się na
      nowo.
    krotki_okres_ubezpieczenia: Ubezpieczenie krótsze niż 12 miesięcy – podstawa zasiłku to najniższa podstawa wymiaru
      składek (po odliczeniu 13,71%) plus tylko 1/12 nadwyżki ponad tę najniższą podstawę za każdy pełny miesiąc
      ubezpieczenia. Jedna wysoka składka tuż przed porodem prawie nie podnosi zasiłku. Poród w pierwszym, niepełnym
      miesiącu ubezpieczenia – podstawą jest najniższa podstawa wymiaru składek po odliczeniu 13,71%. Wyjątek –
      jeśli ubezpieczenie zaczęło się najpóźniej 30 dni po ustaniu ubezpieczenia chorobowego z innego tytułu (np.
      z etatu), dolicza się pełne miesiące z poprzedniego tytułu, łącznie do 12.
    minimum: Jeśli zasiłek po odliczeniu zaliczki na podatek jest niższy niż 1000 zł miesięcznie, ZUS dopłaca różnicę.
    stawka_zasilku: Jak dla wszystkich – 100% podstawy za okres urlopu macierzyńskiego i 70% za rodzicielski albo
      81,5% po wniosku złożonym w 21 dni po porodzie.
    skladki_w_czasie_zasilku: Od pierwszego dnia zasiłku ustaje obowiązek składek emerytalnej i rentowych z działalności
      oraz dobrowolne ubezpieczenie chorobowe. Z działalności obowiązkowa jest tylko składka zdrowotna. Składki
      emerytalną i rentowe od kwoty zasiłku finansuje budżet państwa.
  jak_zlozyc:
    kanaly:
    - PUE/eZUS
    - placówka ZUS
    uwagi: Przystąpienie – formularz ZUS ZUA. Zasiłek macierzyński – wniosek ZAM; zasiłek
      chorobowy – wniosek ZAS-53 (Z-3b zlikwidowany od 24.10.2026). Zasiłki przedsiębiorcom zawsze wypłaca ZUS. Po uzyskaniu zasiłku macierzyńskiego – ZUS ZWUA
      (wyrejestrowanie od pierwszego dnia zasiłku) i ZUS ZZA (samo ubezpieczenie zdrowotne). Po zasiłku – ZUS ZWUA
      i ponownie ZUS ZUA w ciągu 7 dni od pierwszego dnia bez zasiłku. Po tym terminie ubezpieczenie chorobowe zaczyna
      się dopiero od dnia zgłoszenia, czyli powstaje przerwa w ubezpieczeniu.
