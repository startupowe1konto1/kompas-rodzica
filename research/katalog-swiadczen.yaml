# Katalog świadczeń, formalności i uprawnień – Przewodnik przyszłego rodzica (HackNation 2026, zadanie ZUS)
#
# ZASÓB PRZYGOTOWANY PRZED WYDARZENIEM – wymienić w README i w prezentacji (FAQ HackNation, pyt. 11).
# Stan na 2026-11-20. Źródła: zus.pl, gov.pl, teksty ustaw z api.sejm.gov.pl, podatki.gov.pl.
#
# Pole `typ`: swiadczenie (pieniądze na wniosek) | formalnosc (zgłoszenie, obowiązek) |
#             uprawnienie (prawo z mocy przepisów, zwykle wobec pracodawcy) | decyzja (wybór wariantu)
# Pole `weryfikacja`:
#   potwierdzone   – każda wartość odczytana ze źródła w dniu `sprawdzono`
#   czesciowo      – część wartości potwierdzona, reszta opisana w `do_sprawdzenia`
#   do_weryfikacji – NIE używać w aplikacji przed sprawdzeniem
# Pole `do_monitorowania`: rzeczy, które mogą się zmienić (projekty ustaw, limity na kolejny rok).
#
# Aplikacja filtruje rekordy po `dla_kogo` i `etap`, a terminy liczy od zdarzenia z pola `termin.od`.

schemat:
  rola:
  - matka
  - ojciec
  - oboje
  - opiekun
  status_zawodowy:
  - etat
  - zlecenie_z_chorobowym
  - zlecenie_bez_chorobowego
  - dzielo
  - jdg_z_chorobowym
  - jdg_bez_chorobowego
  - bezrobotna
  - studentka
  - rolnik_krus
  etap:
  - planowanie
  - ciaza
  - porod_do_21_dni
  - do_3_miesiecy
  - do_12_miesiecy
  - od_12_do_36_miesiecy
  instytucja:
  - ZUS
  - pracodawca
  - gmina
  - USC
  - KRUS
  - urząd skarbowy
  - inne
  zdarzenie:
  - poczatek_ciazy
  - porod
  - wystawienie_karty_urodzenia
  - ukonczenie_12_miesiecy
  - poczatek_urlopu
  - rozpoczecie_uczeszczania_do_zlobka
  - nadanie_numeru_PESEL
  typ:
  - swiadczenie
  - formalnosc
  - uprawnienie
  - decyzja
  pola_dodatkowe: 'Część rekordów ma pola spoza podstawowego zestawu: kto_wyplaca, wylaczenia, ojciec, odnowienie,
    przerwa_w_aktywnosci, kroki, etapy_dodatkowe, zakres, warianty, skladki, urzedowy_formularz, tresc_wniosku,
    zalaczniki, podstawa_prawna, uwagi_zrodlowe, uwagi_dla_aplikacji, do_monitorowania.'
rekordy:
- id: zgloszenie_urodzenia
  nazwa: Zgłoszenie urodzenia dziecka (akt urodzenia, PESEL, meldunek)
  typ: formalnosc
  instytucja: USC
  dla_kogo:
    rola:
    - matka
    - ojciec
    status_zawodowy: wszystkie
    warunki:
    - Zgłasza matka albo ojciec z pełną zdolnością do czynności prawnych (w urzędzie także rodzic, który skończył
      16 lat).
    - Tylko dziecko urodzone w Polsce.
    - Ojciec, który nie jest mężem matki, musi wcześniej złożyć oświadczenie o uznaniu ojcostwa (patrz rekord uznanie_ojcostwa).
    - W mObywatelu zgłasza tylko rodzic osobiście – bez pełnomocnika. W urzędzie pełnomocnik jest możliwy.
    - Dziecko martwo urodzone zgłasza się w ciągu 3 dni od wystawienia karty martwego urodzenia.
  etap: porod_do_21_dni
  termin:
    od: wystawienie_karty_urodzenia
    limit: 21 dni
    skutek_spoznienia: Kierownik USC sam wybiera imię dziecka i rejestruje urodzenie na podstawie karty urodzenia.
      Nie tracisz pieniędzy, ale bez aktu i numeru PESEL nie złożysz wniosków o świadczenia.
  kwota: null
  jak_zlozyc:
    kanaly:
    - USC osobiście
    - online przez gov.pl
    - aplikacja mObywatel
    uwagi: 'W urzędzie – USC właściwy dla miejsca urodzenia dziecka; wystarczy dowód osobisty lub paszport, dokumenty
      dostajesz tego samego dnia. Online przez gov.pl – profil zaufany, e-dowód albo podpis kwalifikowany oraz adres
      do e-Doręczeń (od 1.01.2026 tylko tą drogą). W aplikacji mObywatel (od 5.03.2026) – potrzebny mDowód, profil
      zaufany i aktywna skrzynka e-Doręczeń; ścieżka: Usługi → Załatw sprawę → Rodzina → Zgłoś urodzenie dziecka;
      jednym zgłoszeniem do pięciorga dzieci. Kartę urodzenia przekazuje do USC szpital (lekarz lub położna) w ciągu
      3 dni – rodzic jej nie dostarcza. Usługa bezpłatna.

      '
  efekt: 'Kierownik USC sporządza akt urodzenia (w urzędzie od razu, przy zgłoszeniu online – następnego dnia roboczego,
    jeśli ma już kartę urodzenia). Dostajesz: jeden bezpłatny odpis skrócony aktu urodzenia, powiadomienie o nadaniu
    numeru PESEL i zaświadczenie o zameldowaniu dziecka. Przy zgłoszeniu online wybierasz odbiór: skrzynka e-Doręczeń,
    poczta albo osobiście w urzędzie.

    '
  odblokowuje:
  - swiadczenie_800_plus
  - becikowe
  - swiadczenie_rodzicielskie
  zrodlo:
  - https://www.gov.pl/web/gov/zglos-urodzenie-dziecka
  - https://www.gov.pl/web/cyfryzacja/zglos-urodzenie-dziecka-w-mobywatelu-bez-umawiania-wizyty-w-urzedzie-bez-kolejek
  - https://info.mobywatel.gov.pl/aktualnosci/zglos-urodzenie-dziecka-w-mObywatelu
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_monitorowania:
  - Strona usługi na gov.pl (aktualizacja 31.12.2025) nie wspomina o mObywatelu – informacja pochodzi z komunikatu
    Ministerstwa Cyfryzacji z 6.03.2026 i strony info.mobywatel.gov.pl.
  do_sprawdzenia: []
- id: zasilek_chorobowy_w_ciazy
  nazwa: Zasiłek chorobowy w czasie ciąży (zwolnienie lekarskie)
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
    warunki:
    - Ubezpieczenie chorobowe (obowiązkowe albo dobrowolne).
    - Okres wyczekiwania – 30 dni nieprzerwanego ubezpieczenia obowiązkowego (etat) albo 90 dni dobrowolnego (zlecenie,
      działalność). Ciąża nie znosi okresu wyczekiwania.
    - Do okresu wyczekiwania wlicza się wcześniejsze ubezpieczenie chorobowe, jeśli przerwa nie przekroczyła 30
      dni albo wynikała z urlopu wychowawczego lub bezpłatnego.
    - Bez okresu wyczekiwania – absolwentka, która została ubezpieczona w ciągu 90 dni od ukończenia szkoły lub
      uzyskania dyplomu; wypadek w drodze do pracy lub z pracy; co najmniej 10 lat obowiązkowego ubezpieczenia chorobowego
      (tylko ubezpieczone obowiązkowo).
    - Przy działalności gospodarczej zasiłek nie przysługuje, gdy zaległość w składkach przekracza 1% minimalnego
      wynagrodzenia. Po spłacie całości w ciągu 6 miesięcy ZUS wypłaci zasiłek za cały okres.
    - Zasiłek chorobowy nie przysługuje w czasie urlopu wychowawczego ani bezpłatnego.
  etap: ciaza
  termin:
    od: null
    limit: 6 miesięcy od ostatniego dnia okresu, za który zasiłek przysługuje
    skutek_spoznienia: Po tym terminie zasiłek przepada (roszczenie się przedawnia).
  kwota:
    opis: 100% podstawy wymiaru od pierwszego dnia zwolnienia, także za pobyt w szpitalu. Warunek – zwolnienie z
      kodem B (niezdolność do pracy w ciąży).
    okres: Najwyżej 270 dni (poza ciążą 182 dni).
    uwagi: Zwolnienie wystawia się z powodu choroby w czasie ciąży, a nie z powodu samej ciąży. Jeśli wcześniej
      chorowałaś bez kodu B, a potem dostaniesz zwolnienie z kodem B, okres 270 dni liczy się od nowa.
  jak_zlozyc:
    kanaly:
    - e-ZLA wystawia lekarz
    - pracodawca lub zleceniodawca
    - PUE/eZUS
    uwagi: Etat – przez pierwsze 33 dni choroby w roku (14 dni po 50. roku życia) pracodawca wypłaca wynagrodzenie
      chorobowe, w ciąży 100%; zasiłek z ZUS przysługuje od 34. (15.) dnia. Zlecenie i działalność – zasiłek od
      pierwszego dnia, bez wynagrodzenia chorobowego. Zasiłek wypłaca pracodawca, jeśli zgłasza do ubezpieczenia
      chorobowego ponad 20 osób; w pozostałych przypadkach ZUS. Przedsiębiorczyni zawsze dostaje zasiłek z ZUS i
      składa wniosek ZAS-53 (opis zadania ZUS; Z-3b zlikwidowany od 24.10.2026).
  zrodlo:
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-chorobowy
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-chorobowy/z-ubezpieczenia-chorobowego/wysokosc
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-chorobowy/z-ubezpieczenia-chorobowego/prawo-do-zasilku-i-okres-przyslugiwania
  - https://www.zus.pl/documents/10182/167567/1184_26+Poradnik+dla+rodzic%C3%B3w.pdf/9378de60-151e-9b9f-ba65-abdf41d9f5b4
  - https://api.sejm.gov.pl/eli/acts/DU/1999/636/text/U/D19990636Lj.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/1974/141/text/U/D19740141Lj.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
- id: zasilek_macierzynski_urlop_macierzynski
  nazwa: Zasiłek macierzyński za okres urlopu macierzyńskiego
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
    warunki:
    - Ubezpieczenie chorobowe obowiązkowe albo dobrowolne w dniu porodu.
  etap: porod_do_21_dni
  termin:
    od: porod
    limit: 6 miesięcy od ostatniego dnia okresu, za który zasiłek przysługuje
    skutek_spoznienia: Po tym terminie zasiłek przepada (roszczenie się przedawnia). Termin wynosi 3 lata, jeśli
      zasiłku nie wypłacono przez błąd ZUS albo pracodawcy.
    uwagi: Do 6 tygodni urlopu można wykorzystać przed porodem. Wniosek o zasiłek za okres przed porodem składa
      się najpóźniej 14 dni przed planowanym początkiem urlopu, razem z zaświadczeniem o przewidywanej dacie porodu.
      Zasiłek macierzyński nie wymaga okresu wyczekiwania – wystarczy ubezpieczenie chorobowe w dniu porodu.
  kwota:
    opis: 100% podstawy wymiaru
    okres:
      jedno_dziecko: 20 tygodni
      dwoje: 31 tygodni
      troje: 33 tygodnie
      czworo: 35 tygodni
      piecioro_i_wiecej: 37 tygodni
      smierc_dziecka: Gdy dziecko urodzi się martwe albo umrze przed 8. tygodniem życia – 8 tygodni po porodzie,
        nie krócej niż 7 dni od śmierci dziecka.
    minimum: Jeśli miesięczny zasiłek po odliczeniu zaliczki na podatek jest niższy niż 1000 zł (kwota świadczenia
      rodzicielskiego), płatnik zasiłku dopłaca różnicę. Dopłata nie przysługuje do zasiłku za urlop ojcowski ani
      do „zasiłku w wysokości zasiłku macierzyńskiego”.
  jak_zlozyc:
    kanaly:
    - pracodawca
    - zleceniodawca
    - PUE/eZUS
    - placówka ZUS
    dokumenty:
      etat: Wniosek o urlop macierzyński u pracodawcy. Jeśli zasiłek wypłaca ZUS, pracodawca przekazuje dokumenty
        do ZUS razem z zaświadczeniem Z-3 – osobnego wniosku ZAM nie trzeba składać.
      zlecenie_z_chorobowym: Wniosek o zasiłek macierzyński (własne pismo albo formularz ZAM) u zleceniodawcy. Jeśli
        zasiłek wypłaca ZUS, zleceniodawca dołącza zaświadczenie Z-3a.
      jdg_z_chorobowym: Wniosek ZAM prosto do ZUS (Z-3b zlikwidowany od 24.10.2026), najwygodniej przez eZUS. Zaświadczenia
        Z-3 ani Z-3a nie potrzeba.
      wszyscy: Dane dziecka (imię i nazwisko, PESEL, data i miejsce urodzenia) oraz dane drugiego rodzica. Za okres
        przed porodem – zaświadczenie lekarskie o przewidywanej dacie porodu.
    uwagi: ZUS może sam pobrać odpis aktu urodzenia z rejestru stanu cywilnego. Strona ZUS „Niezbędne dokumenty”
      (aktualizacja 24.10.2026) wymaga danych dziecka; starsze opisy mówią o okazaniu skróconego odpisu aktu urodzenia.
  powiazane:
  - wybor_wariantu_81_5
  - zasilek_macierzynski_urlop_rodzicielski
  - przejecie_urlopu_przez_ojca
  - zasilek_po_ustaniu_ubezpieczenia
  - jdg_dobrowolne_chorobowe
  - porod_na_urlopie_wychowawczym
  zrodlo:
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/komu-przysluguje
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/wysokosc
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/postepowanie-w-sprawie-zasilkow/platnicy-zasilku
  - https://www.zus.pl/-/jak-uzyskac-zasilek-macierzynski-z-tytulu-urodzenia-dziecka
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/niezbedne-dokumenty
  - https://www.zus.pl/wzory-formularzy/zasilki/zasilek-macierzynski
  - https://www.zus.pl/documents/10182/167567/1184_26+Poradnik+dla+rodzic%C3%B3w.pdf/9378de60-151e-9b9f-ba65-abdf41d9f5b4
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/postepowanie-w-sprawie-zasilkow/przedawnienie-roszczenia-o-wyplate-zasilku
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/prawo-do-zasilku-i-okres-przyslugiwania/za-okres-urlopu-macierzynskiego-albo-urlopu-na-warunkach-urlopu-macierzynskiego
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
  kto_wyplaca:
    pracodawca_lub_zleceniodawca: Gdy zgłasza do ubezpieczenia chorobowego ponad 20 osób (stan na 30 listopada poprzedniego
      roku).
    ZUS: Gdy płatnik zgłasza najwyżej 20 osób; zawsze przy działalności gospodarczej i przy zasiłku za okres po
      ustaniu ubezpieczenia.
    termin_wyplaty: ZUS wypłaca najpóźniej w ciągu 30 dni od wyjaśnienia ostatniej okoliczności potrzebnej do ustalenia
      prawa. Pracodawca – w terminie wypłaty wynagrodzeń.
- id: wybor_wariantu_81_5
  nazwa: Wybór sposobu wypłaty – 81,5% przez cały okres zamiast 100% i 70%
  typ: decyzja
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
  etap: porod_do_21_dni
  termin:
    od: porod
    limit: 21 dni
    skutek_spoznienia: 'Zostaje wariant domyślny: 100% za urlop macierzyński i 70% za rodzicielski. To NIE jest
      utrata pieniędzy – przy pełnym wykorzystaniu obu urlopów suma jest praktycznie ta sama (20 tyg. x 100% + 32
      tyg. x 70% daje średnio ok. 81,5%). Różni się rozkład wypłat w czasie.

      '
  kwota:
    opis: 81,5% podstawy za urlop macierzyński i rodzicielski łącznie
    wyjatek: 9 tygodni urlopu rodzicielskiego zastrzeżone dla drugiego rodzica zawsze płatne 70%.
    wyrownanie: 'Jeśli w pierwszym roku życia dziecka nie wykorzystasz ani dnia urlopu rodzicielskiego, na wniosek
      dostajesz wyrównanie zasiłku za urlop macierzyński do 100%.

      '
  jak_zlozyc:
    kanaly:
    - pracodawca
    - PUE/eZUS
    uwagi: Wniosek o zasiłek za oba urlopy w pełnym wymiarze albo deklaracja wykorzystania pełnego urlopu rodzicielskiego.
  zrodlo:
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/wysokosc
  - https://www.zus.pl/-/jak-uzyskac-zasilek-macierzynski-z-tytulu-urodzenia-dziecka
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  uwagi_zrodlowe: Termin 21 dni po porodzie dotyczy wniosku o zasiłek macierzyński (art. 30a i art. 31 ust. 3 ustawy
    zasiłkowej), nie wniosku o urlop. Dawny łączny wniosek urlopowy (art. 179(1) Kodeksu pracy) jest uchylony. Strona
    gov.pl o urlopach rodzicielskich podaje 80% – obowiązuje wartość z ustawy i zus.pl, czyli 81,5%.
- id: zasilek_macierzynski_urlop_rodzicielski
  nazwa: Zasiłek macierzyński za okres urlopu rodzicielskiego
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - oboje
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
  etap: do_12_miesiecy
  termin:
    od: poczatek_urlopu
    limit: Etat – wniosek o urlop u pracodawcy najpóźniej 21 dni przed jego początkiem. Zlecenie, działalność i
      zasiłek po ustaniu ubezpieczenia – wniosek o zasiłek przed pierwszym dniem okresu, którego dotyczy.
    do_kiedy: Ostatnia część najpóźniej do końca roku kalendarzowego, w którym dziecko kończy 6 lat.
    liczba_czesci: Jednorazowo albo najwyżej w 5 częściach. Części liczy się według liczby wniosków o urlop; wlicza
      się też wnioski o zasiłek za ten okres złożone przez ubezpieczoną matkę lub ubezpieczonego ojca.
    skutek_spoznienia: Osobie spoza etatu ZUS nie wypłaci zasiłku za okres objęty spóźnionym wnioskiem, chyba że
      opóźnienie nie wynikało z jej winy. Pracownik dostanie zasiłek, jeśli pracodawca mimo spóźnienia udzieli urlopu.
  kwota:
    opis: 70% podstawy wymiaru (albo 81,5% przy wyborze wariantu w 21 dni po porodzie)
    okres:
      jedno_dziecko: 41 tygodni
      wiecej_dzieci_przy_jednym_porodzie: 43 tygodnie
      dziecko_z_zaswiadczeniem_za_zyciem_jedno: 65 tygodni
      dziecko_z_zaswiadczeniem_za_zyciem_wiecej_dzieci: 67 tygodni
      uwagi: 65 i 67 tygodni dotyczą rodziców dziecka z zaświadczeniem „Za życiem” (ciężka, nieodwracalna choroba
        lub upośledzenie; art. 4 ust. 3 ustawy z 4.11.2016). Do wniosku dołącza się oświadczenie, że dziecko ma
        takie zaświadczenie. Oboje rodzice mogą korzystać z urlopu jednocześnie; łączny wymiar się nie zwiększa.
    czesc_nieprzenoszalna: '9 tygodni dla każdego z rodziców – nie można ich oddać drugiemu rodzicowi. Przykład
      ZUS: matka może wykorzystać najwyżej 32 tygodnie z 41, pozostałe 9 tylko ojciec. Kto wykorzystał co najmniej
      9 tygodni urlopu, wykorzystał swoją część.'
  jak_zlozyc:
    kanaly:
    - pracodawca
    - PUE/eZUS
  zrodlo:
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/prawo-do-zasilku-i-okres-przyslugiwania/za-okres-dodatkowego-urlopu-rodzicielskiego
  - https://api.sejm.gov.pl/eli/acts/DU/1974/141/text/U/D19740141Lj.pdf
  - https://www.zus.pl/documents/10182/24202/Komentarz+do+ustawy+o+%C5%9Bwiadczeniach+pieni%C4%99%C5%BCnych+z+ubezpieczenia+spo%C5%82ecznego+w+razie+choroby+i+macierzy%C5%84stwa+kwiecie%C5%84+2022.pdf/7a31a278-8c06-cee4-3542-1d5bb8b36ad6
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/niezbedne-dokumenty
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Skutek spóźnienia dla osób spoza etatu pochodzi z Komentarza ZUS z 2023 r. – potwierdzić, że ZUS nadal tak postępuje.
  - Strona ZUS podaje też wymiary 38 i 62 tygodnie przy przyjęciu dziecka na wychowanie – opis jest niejasny, do
    wyjaśnienia przy rekordzie o adopcji.
  powiazane:
  - wybor_wariantu_81_5
  - laczenie_urlopu_rodzicielskiego_z_praca
- id: urlop_ojcowski
  nazwa: Urlop ojcowski i zasiłek za jego okres
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - ojciec
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
    warunki:
    - Niezależny od urlopu matki; nie przechodzi na matkę. Przysługuje także wtedy, gdy matka nie ma ubezpieczenia
      chorobowego.
    - Ojciec na zleceniu albo z działalnością dostaje zasiłek za ten okres, jeśli ma dobrowolne ubezpieczenie chorobowe.
    - Uwaga dla dobrowolnie ubezpieczonych – na czas zasiłku ubezpieczenie chorobowe ustaje z mocy prawa. Trzeba
      się wyrejestrować (ZUS ZWUA), zgłosić do ubezpieczenia zdrowotnego (ZUS ZZA), a po zasiłku ponownie zgłosić
      do chorobowego (ZUS ZUA) w ciągu 7 dni od końca okresu zasiłku – także wtedy, gdy zasiłek jeszcze nie wpłynął.
      Przy zleceniu dokumenty składa zleceniodawca. Bez ponownego zgłoszenia dobrowolnego ubezpieczenia chorobowego
      już nie ma.
  etap: do_12_miesiecy
  termin:
    od: porod
    limit: do ukończenia przez dziecko 12. miesiąca życia
    wniosek: Etat – wniosek u pracodawcy najpóźniej 7 dni przed początkiem urlopu; pracodawca musi go uwzględnić.
      Zlecenie i działalność – wniosek o zasiłek przed pierwszym dniem okresu, z datą jego rozpoczęcia.
    skutek_spoznienia: Urlop przepada po pierwszych urodzinach dziecka.
    uwagi: Przy adopcji – do 12 miesięcy od uprawomocnienia się postanowienia o przysposobieniu, nie dłużej niż
      do ukończenia przez dziecko 14 lat.
  kwota:
    opis: 100% podstawy wymiaru
    okres: Do 2 tygodni (14 dni), jednorazowo albo w 2 częściach. Żadna część nie może być krótsza niż tydzień;
      części nie muszą następować po sobie.
    minimum: Do zasiłku za urlop ojcowski nie ma dopłaty do 1000 zł.
  jak_zlozyc:
    kanaly:
    - pracodawca
    - zleceniodawca
    - PUE/eZUS
    uwagi: Potrzebne są dane dziecka (imię i nazwisko, PESEL, data i miejsce urodzenia), dane drugiego rodzica i
      oświadczenie, czy zasiłek za urlop ojcowski nie został już pobrany z innego tytułu.
  zrodlo:
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/prawo-do-zasilku-i-okres-przyslugiwania/za-okres-dodatkowego-urlopu-ojcowskiego
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/wysokosc
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/niezbedne-dokumenty
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/postepowanie-w-sprawie-zasilkow/osoby-podlegajace-dobrowolnemu-ubezpieczeniu-chorobowemu
  - https://www.zus.pl/documents/10182/167567/1184_26+Poradnik+dla+rodzic%C3%B3w.pdf/9378de60-151e-9b9f-ba65-abdf41d9f5b4
  - https://api.sejm.gov.pl/eli/acts/DU/1974/141/text/U/D19740141Lj.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
- id: uzupelniajacy_urlop_macierzynski
  nazwa: Uzupełniający urlop macierzyński (wcześniak albo pobyt dziecka w szpitalu)
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - oboje
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
    warunki:
    - Przysługuje za czas pobytu dziecka w szpitalu – nie za samo wcześniactwo.
    - Przypadek 1 – dziecko urodzone przed ukończeniem 28. tygodnia ciąży albo z masą urodzeniową do 1000 g.
    - Przypadek 2 – dziecko urodzone po ukończeniu 28. i przed ukończeniem 37. tygodnia ciąży, z masą urodzeniową
      ponad 1000 g.
    - Przypadek 3 – dziecko urodzone po ukończeniu 37. tygodnia ciąży, jeśli było w szpitalu co najmniej 2 kolejne
      dni, a pierwszy z nich wypadł między 5. a 28. dniem po porodzie.
    - Korzysta jedno z rodziców. Urlopu ani zasiłku za ten okres nie da się podzielić między matkę i ojca.
  etap: do_3_miesiecy
  termin:
    od: koniec urlopu macierzyńskiego (urlop uzupełniający zaczyna się bezpośrednio po nim)
    limit: Etat – wniosek u pracodawcy najpóźniej 21 dni przed końcem urlopu macierzyńskiego. Zlecenie i działalność
      – wniosek przed końcem pobierania zasiłku macierzyńskiego.
    skutek_spoznienia: null
  kwota:
    opis: 100% podstawy wymiaru
    okres:
      przypadek_1: Tydzień urlopu za każdy tydzień pobytu dziecka w szpitalu do końca 15. tygodnia po porodzie –
        najwyżej 15 tygodni.
      przypadek_2: Tydzień urlopu za każdy tydzień pobytu dziecka w szpitalu do końca 8. tygodnia po porodzie –
        najwyżej 8 tygodni.
      przypadek_3: Tydzień urlopu za każdy tydzień pobytu dziecka w szpitalu od 5. dnia do końca 8. tygodnia po
        porodzie – najwyżej 8 tygodni.
    zasady_liczenia: Okresy pobytu w szpitalu sumuje się. Niepełny tydzień zaokrągla się w górę do pełnego. Przy
      porodzie mnogim liczy się masa najlżejszego dziecka i pobyt dziecka najdłużej leżącego w szpitalu.
  zrodlo:
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/prawo-do-zasilku-i-okres-przyslugiwania/za-okres-uzupelniajacego-urlopu-macierzynskiego
  - https://api.sejm.gov.pl/eli/acts/DU/1974/141/text/U/D19740141Lj.pdf
  - https://www.zus.pl/-/jak-uzyskac-zasilek-macierzynski-z-tytulu-urodzenia-dziecka
  - https://www.zus.pl/swiadczenia/zasilki/zasilek-macierzynski/niezbedne-dokumenty
  - https://www.zus.pl/documents/10182/167567/1184_26+Poradnik+dla+rodzic%C3%B3w.pdf/9378de60-151e-9b9f-ba65-abdf41d9f5b4
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
  jak_zlozyc:
    kanaly:
    - pracodawca
    - zleceniodawca
    - PUE/eZUS
    uwagi: Udzielany jednorazowo. Do wniosku dołącza się zaświadczenie ze szpitala (okres pobytu dziecka oraz tydzień
      ciąży lub masa urodzeniowa) i oświadczenie, że drugi rodzic nie będzie korzystał z tego urlopu ani zasiłku.
      We wniosku podaje się datę końca urlopu macierzyńskiego. Jeśli wniosek o urlop rodzicielski był już złożony,
      trzeba zaktualizować jego daty (wniosek ZAM).
  uwagi_zrodlowe: 'Poradnik ZUS 2026 pisze o rodzicach „zatrudnionych na podstawie umowy o pracę” i o pobycie dziecka
    w szpitalu „co najmniej 5 dni”. Strona ZUS i Kodeks pracy mówią inaczej: zasiłek dostają też osoby spoza etatu,
    a warunek to 2 kolejne dni pobytu, z pierwszym między 5. a 28. dniem po porodzie. W katalogu przyjęto stronę
    ZUS i ustawę. Skutku spóźnienia z wnioskiem źródła nie opisują.'
- id: swiadczenie_rodzicielskie
  nazwa: Świadczenie rodzicielskie („kosiniakowe”)
  typ: swiadczenie
  instytucja: gmina
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - zlecenie_bez_chorobowego
    - dzielo
    - jdg_bez_chorobowego
    - bezrobotna
    - studentka
    warunki:
    - Brak prawa do zasiłku macierzyńskiego.
    - Matka i ojciec nie mogą pobierać go jednocześnie na to samo dziecko.
  etap: do_3_miesiecy
  termin:
    od: porod
    limit: 3 miesiące
    skutek_spoznienia: 'Wniosek w ciągu 3 miesięcy od urodzenia – świadczenie od miesiąca narodzin. Później – dopiero
      od miesiąca złożenia wniosku. Okres świadczenia (np. 52 tygodnie) liczy się od dnia porodu, więc miesiące
      sprzed wniosku przepadają – ok. 1000 zł za każdy.

      '
  kwota:
    opis: 1000 zł miesięcznie, niezależnie od dochodu (za niepełny miesiąc proporcjonalnie do liczby dni)
    okres:
      jedno_dziecko: 52 tygodnie
      dwoje: 65 tygodni
      troje: 67 tygodni
      czworo: 69 tygodni
      piecioro_i_wiecej: 71 tygodni
    wydluzenie: 'Za pobyt dziecka w szpitalu po porodzie okres wydłuża się o tydzień za każdy tydzień pobytu: do
      15 tygodni (urodzenie przed 28. tygodniem ciąży albo masa do 1000 g) albo do 8 tygodni (pozostałe przypadki
      opisane na stronie). Wniosek o wydłużenie – najpóźniej do końca miesiąca następującego po okresie podstawowym;
      potrzebne zaświadczenie ze szpitala.

      '
    uwagi: 'Jedno świadczenie bez względu na liczbę dzieci. Matka pobierająca zasiłek dla bezrobotnych dostaje różnicę
      między 1000 zł a zasiłkiem netto.

      '
  jak_zlozyc:
    kanaly:
    - portal Emp@tia
    - urząd gminy lub ośrodek pomocy społecznej
    - pocztą
    uwagi: 'Emp@tia wymaga profilu zaufanego albo podpisu kwalifikowanego. Wniosek rozpatruje gmina właściwa dla
      miejsca zamieszkania (urząd miasta lub gminy, ośrodek pomocy społecznej, centrum świadczeń). Decyzja w ciągu
      miesiąca, w trudnych sprawach – dwóch. Potrzebne: numery PESEL, e-mail, numer rachunku. Odwołanie w 14 dni
      do samorządowego kolegium odwoławczego.

      '
  zrodlo:
  - https://www.gov.pl/web/gov/uzyskaj-swiadczenie-rodzicielskie
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1240/text.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
  ojciec:
    opis: W pierwszej kolejności świadczenie należy się matce. Ojciec dostaje je w trzech sytuacjach.
    sytuacje:
    - Matka skróciła (na swój wniosek) pobieranie świadczenia rodzicielskiego albo zasiłku macierzyńskiego – po
      wykorzystaniu co najmniej 14 tygodni od urodzenia dziecka.
    - Matka zmarła.
    - Matka porzuciła dziecko.
    termin: 3 miesiące na wniosek liczy się wtedy od dnia skrócenia, śmierci matki albo porzucenia dziecka.
  wylaczenia:
  - Choć jedno z rodziców pobiera zasiłek macierzyński (także za urlop rodzicielski lub uzupełniający urlop macierzyński).
  - Nie opiekujesz się dzieckiem osobiście – także wtedy, gdy praca na to nie pozwala.
  - Dziecko jest w pieczy zastępczej.
  - Na to samo dziecko jest już przyznane: świadczenie rodzicielskie, dodatek do zasiłku rodzinnego za urlop wychowawczy,
      świadczenie pielęgnacyjne, specjalny zasiłek opiekuńczy albo zasiłek dla opiekuna.
  - Podobne świadczenie przysługuje za granicą (chyba że przepisy o koordynacji stanowią inaczej).
- id: becikowe
  nazwa: Jednorazowa zapomoga z tytułu urodzenia dziecka („becikowe”)
  typ: swiadczenie
  instytucja: gmina
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Dochód na osobę w rodzinie nie przekracza 1922 zł netto miesięcznie.
    - Matka była pod opieką medyczną najpóźniej od 10. tygodnia ciąży do porodu (zaświadczenie od lekarza lub położnej).
  etap: do_12_miesiecy
  termin:
    od: porod
    limit: 12 miesięcy
    skutek_spoznienia: Wniosek nie zostanie rozpatrzony, świadczenie przepada.
  kwota:
    opis: 1000 zł jednorazowo
  jak_zlozyc:
    kanaly:
    - urząd gminy lub ośrodek pomocy społecznej
    - portal Emp@tia
  uwagi_dla_aplikacji: 'Warunek opieki medycznej od 10. tygodnia trzeba pokazać już na etapie ciąży – po porodzie
    nie da się go nadrobić.

    '
  zrodlo:
  - https://www.gov.pl/web/gov/uzyskaj-becikowe
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
- id: swiadczenie_800_plus
  nazwa: Świadczenie wychowawcze 800+
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Niezależne od dochodu. Na każde dziecko do 18. roku życia.
  etap: do_3_miesiecy
  termin:
    od: porod
    limit: 3 miesiące
    skutek_spoznienia: 'Po 3 miesiącach od urodzenia świadczenie przysługuje dopiero od miesiąca, w którym wpłynął
      wniosek. Za wcześniejsze miesiące nie ma wyrównania – tracisz 800 zł za każdy pominięty miesiąc.

      '
  kwota:
    opis: '800 zł miesięcznie na dziecko. Za miesiąc urodzenia (i miesiąc 18. urodzin) proporcjonalnie do liczby
      dni, z zaokrągleniem do 10 groszy w górę. Przy opiece naprzemiennej orzeczonej przez sąd – po połowie dla
      każdego z rodziców.

      '
  jak_zlozyc:
    kanaly:
    - PUE/eZUS
    - aplikacja mZUS
    - bankowość elektroniczna
    - portal Emp@tia
    uwagi: 'Tylko elektronicznie. Rodzic składa wniosek SW-R. Przez mZUS, bank i Emp@tię wniosek złoży tylko rodzic
      z numerem PESEL; opiekunowie (SW-O) i dyrektorzy placówek (SW-D) – tylko przez eZUS. Jeśli składasz przez
      bank albo Emp@tię i nie masz konta eZUS, ZUS założy je sam na podstawie danych z wniosku. ZUS nie wydaje decyzji
      o przyznaniu – informacja trafia na eZUS i e-mailem.

      '
  odnowienie:
    opis: 'Okres świadczeniowy trwa od 1 czerwca do 31 maja. Wniosek na kolejny okres składa się co roku, od 1 lutego.
      Wniosek złożony do 30 czerwca daje prawo od 1 czerwca. Po 30 czerwca – dopiero od miesiąca złożenia wniosku.

      '
    terminy:
    - Wniosek od 1 lutego do 30 kwietnia – wypłata do 30 czerwca.
    - Wniosek w maju – wypłata z wyrównaniem za czerwiec do 31 lipca.
    - Wniosek w czerwcu – wypłata z wyrównaniem za czerwiec do 31 sierpnia.
    - Wniosek w lipcu – świadczenie tylko od lipca (czerwiec przepada, 800 zł na dziecko), wypłata do 30 września.
    - Wniosek w sierpniu – świadczenie tylko od sierpnia (czerwiec i lipiec przepadają), wypłata do 31 października.
    automatyczne_odnawianie:
      stan: projekt ustawy – jeszcze NIE uchwalony (stan na 2026-11-18)
      opis: 'Rada Ministrów przyjęła 20.10.2026 projekt ustawy o automatycznym odnawianiu 800+ bez corocznego wniosku.
        Projekt jest w Sejmie (druk nr 3267, wpłynął 21.10.2026, I czytanie w komisjach 17.11.2026). Planowany start:
        okres świadczeniowy 2027/2028, czyli od 1 czerwca 2027. Pierwszy wniosek na nowo narodzone dziecko nadal
        będzie potrzebny. Do czasu uchwalenia ustawy obowiązuje coroczny wniosek (na okres 2027/2028 trzeba śledzić,
        czy ustawa weszła w życie).

        '
  zrodlo:
  - https://www.zus.pl/swiadczenia/swiadczenia-dla-rodzin/swiadczenie-wychowawcze-800-plus
  - https://api.sejm.gov.pl/eli/acts/DU/2026/508/text.pdf
  - https://www.gov.pl/web/rodzina/rodzicu-koniec-ze-skladaniem-wnioskow-o-800-kazdego-roku
  - https://api.sejm.gov.pl/sejm/term10/processes/3267
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_monitorowania:
  - Przed 1 lutego 2027 sprawdzić, czy ustawa o automatycznym odnawianiu (druk sejmowy 3267) została uchwalona i
    od kiedy działa.
  do_sprawdzenia: []
- id: aktywnie_w_domu
  nazwa: Aktywny Rodzic – świadczenie „aktywnie w domu”
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Dziecko mieszka z Tobą i jest na Twoim utrzymaniu. Mieszkasz w Polsce.
    - Dziecko w wieku od 12. do 35. miesiąca – od pierwszego dnia miesiąca, w którym kończy 12 miesięcy, do końca
      miesiąca przed ukończeniem 36. miesiąca.
    - Bez względu na dochód i bez warunku pracy.
    - Z opiekunów tylko opiekun faktyczny (złożył do sądu wniosek o adopcję). Nie przysługuje, gdy dziecko jest
      w pieczy zastępczej. Opiekun prawny nie może złożyć wniosku.
    - Na to samo dziecko w danym miesiącu tylko jedno świadczenie z programu Aktywny Rodzic. Można je zmieniać wielokrotnie.
    - Nie przysługuje obywatelom Ukrainy ze statusem UKR.
  etap: od_12_do_36_miesiecy
  termin:
    od: ukonczenie_12_miesiecy
    limit: Wniosek najwcześniej w miesiącu, w którym dziecko kończy 12. miesiąc. Najlepiej złożyć go w tym właśnie
      miesiącu.
    skutek_spoznienia: 'Świadczenie przysługuje od miesiąca, w którym wpłynął wniosek. Nie ma wyrównania wstecz
      i nie ma tu reguły „3 miesięcy”. Każdy miesiąc zwłoki to 500 zł mniej.

      '
  kwota:
    opis: 500 zł miesięcznie na dziecko (250 zł dla każdego z rodziców przy opiece naprzemiennej orzeczonej przez
      sąd)
    uwagi: 'Kwota taka sama dla dziecka z niepełnosprawnością. Za niepełny miesiąc wypłacana w całości. Bez podatku
      i składek. Nie można wybrać 1000 zł przez 12 miesięcy, jak przy dawnym RKO.

      '
    limit_laczny: Jeśli na dziecko pobierano wcześniej rodzinny kapitał opiekuńczy (RKO), RKO i „aktywnie w domu”
      razem nie mogą przekroczyć 12 000 zł.
  jak_zlozyc:
    kanaly:
    - PUE/eZUS
    - aplikacja mZUS
    - bankowość elektroniczna
    - portal Emp@tia
    uwagi: 'Tylko elektronicznie – wniosków papierowych ZUS nie rozpatruje. Pieniądze idą na rachunek bankowy podany
      we wniosku. Korespondencja i decyzje tylko przez eZUS. Kto składa przez bank albo Emp@tię i nie ma konta eZUS,
      temu ZUS zakłada je sam.

      '
