- id: elastyczna_organizacja_pracy_i_praca_zdalna
  nazwa: Praca zdalna, elastyczna organizacja pracy i obniżony wymiar czasu pracy dla rodziców
  typ: uprawnienie
  instytucja: pracodawca
  dla_kogo:
    rola:
    - matka
    - ojciec
    status_zawodowy:
    - etat
    warunki:
    - Tylko pracownicy. Nie dotyczy zlecenia, umowy o dzieło ani działalności gospodarczej.
  etap: ciaza
  etapy_dodatkowe:
  - do_12_miesiecy
  - od_12_do_36_miesiecy
  termin:
    od: null
    limit: Wniosek o elastyczną organizację pracy i o obniżenie wymiaru czasu pracy – co najmniej 21 dni przed planowanym
      początkiem.
    skutek_spoznienia: Przy obniżeniu wymiaru czasu pracy pracodawca obniża go najpóźniej po 21 dniach od złożenia
      wniosku.
  kwota: null
  warianty:
    praca_zdalna:
      dla_kogo: Pracownica w ciąży i pracownik wychowujący dziecko do ukończenia 4. roku życia.
      zasada: Pracodawca musi uwzględnić wniosek, chyba że nie pozwala na to organizacja pracy albo rodzaj pracy.
      odmowa: Przyczynę odmowy pracodawca podaje na papierze albo elektronicznie w 7 dni roboczych od złożenia wniosku.
      podstawa: KP art. 67[19] § 6
    elastyczna_organizacja_pracy:
      dla_kogo: Pracownik wychowujący dziecko do ukończenia 8. roku życia.
      co_obejmuje: Praca zdalna, przerywany czas pracy, skrócony tydzień pracy, praca weekendowa, ruchomy rozkład
        czasu pracy (różne godziny rozpoczynania), indywidualny rozkład czasu pracy, obniżenie wymiaru czasu pracy.
      zasada: Pracodawca rozpatruje wniosek i może odmówić, ale musi podać przyczynę. Odpowiada w 7 dni od otrzymania
        wniosku.
      tresc_wniosku:
      - Imię, nazwisko i data urodzenia dziecka.
      - Przyczyna, dla której potrzebujesz elastycznej organizacji pracy.
      - Termin rozpoczęcia i zakończenia.
      - Rodzaj elastycznej organizacji pracy.
      ochrona: Złożenie wniosku nie może być przyczyną zwolnienia ani przygotowań do zwolnienia.
      podstawa: KP art. 188[1]
    obnizony_wymiar_zamiast_urlopu_wychowawczego:
      dla_kogo: Pracownik uprawniony do urlopu wychowawczego, w okresie, w którym mógłby z niego korzystać.
      zasada: Wymiar czasu pracy można obniżyć najniżej do połowy etatu. Pracodawca musi uwzględnić wniosek.
      tresc_wniosku:
      - Imię i nazwisko pracownika.
      - Imię i nazwisko dziecka.
      - Okres pracy w obniżonym wymiarze.
      - Wymiar czasu pracy.
      zalaczniki:
      - Skrócony odpis aktu urodzenia dziecka (może być kopia).
      - Oświadczenie o okresie, w którym dotychczas pracowałeś w obniżonym wymiarze.
      ochrona: Zakaz zwolnienia od złożenia wniosku do powrotu do pełnego wymiaru, łącznie najwyżej 12 miesięcy.
      podstawa: KP art. 186[7], art. 186[8]; rozp_2025 § 20
    czas_pracy_rodzica_dziecka_do_4_lat: W systemach z przedłużonym dobowym wymiarem czasu pracy (równoważny, ruch
      ciągły, skrócony tydzień, praca weekendowa) bez twojej zgody pracujesz najwyżej 8 godzin na dobę. Korzysta
      z tego jedno z rodziców.
  jak_zlozyc:
    kanaly:
    - pracodawca – na papierze
    - pracodawca – elektronicznie
    uwagi: Nie ma urzędowych formularzy. Pisma w dowolnej formie z treścią wskazaną wyżej. Dla wniosku o pracę zdalną
      Kodeks nie podaje terminu.
  urzedowy_formularz: false
  podstawa_prawna: KP art. 67[19] § 2 i § 6; art. 148 pkt 3; art. 186[7]; art. 186[8]; art. 188[1]; art. 189[1];
    rozp_2025 § 20
  zrodlo:
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1245/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2025/322/text.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
- id: dni_opieki_nad_dzieckiem
  nazwa: Dni wolne na opiekę – 2 dni na dziecko, urlop opiekuńczy, siła wyższa
  typ: uprawnienie
  instytucja: pracodawca
  dla_kogo:
    rola:
    - matka
    - ojciec
    status_zawodowy:
    - etat
    warunki:
    - Tylko pracownicy. Nie dotyczy zlecenia, umowy o dzieło ani działalności gospodarczej.
  etap: do_12_miesiecy
  etapy_dodatkowe:
  - do_3_miesiecy
  - od_12_do_36_miesiecy
  termin:
    od: null
    limit: Każde z trzech zwolnień liczy się na rok kalendarzowy.
    skutek_spoznienia: null
  kwota: null
  warianty:
    opieka_nad_dzieckiem_do_14_lat:
      wymiar: 2 dni albo 16 godzin w roku kalendarzowym
      wynagrodzenie: 100% – zachowujesz prawo do wynagrodzenia
      zasady:
      - Przysługuje pracownikowi wychowującemu co najmniej jedno dziecko w wieku do 14 lat.
      - O tym, czy bierzesz dni, czy godziny, decydujesz w pierwszym wniosku w danym roku.
      - Jeśli oboje rodzice pracują na etacie, korzysta jedno z nich.
      - Przy niepełnym etacie wymiar godzinowy liczy się proporcjonalnie.
      podstawa: KP art. 188, art. 189[1]
    urlop_opiekunczy:
      wymiar: 5 dni w roku kalendarzowym
      wynagrodzenie: do_weryfikacji
      zasady:
      - Na osobistą opiekę lub wsparcie dla syna, córki, matki, ojca, małżonka albo domownika z poważnych względów
        medycznych.
      - Wniosek na papierze albo elektronicznie co najmniej 1 dzień przed urlopem.
      - We wniosku podajesz imię i nazwisko osoby, przyczynę opieki i stopień pokrewieństwa albo adres domownika.
      podstawa: KP art. 173[1]–173[3]
    sila_wyzsza:
      wymiar: 2 dni albo 16 godzin w roku kalendarzowym
      wynagrodzenie: 50% – połowa wynagrodzenia
      zasady:
      - Pilne sprawy rodzinne spowodowane chorobą lub wypadkiem, gdy musisz być obecny natychmiast.
      - Wniosek możesz zgłosić najpóźniej w dniu zwolnienia. Pracodawca musi go uwzględnić.
      podstawa: KP art. 148[1]
  jak_zlozyc:
    kanaly:
    - pracodawca
    uwagi: Nie ma urzędowych formularzy.
  urzedowy_formularz: false
  podstawa_prawna: KP art. 148[1]; art. 173[1]–173[3]; art. 188; art. 189[1]
  zrodlo:
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1245/text.pdf
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Czy urlop opiekuńczy jest bezpłatny – przepis nie przyznaje wynagrodzenia, ale nie mówi tego wprost; potwierdzić
    na stronie MRPiPS albo PIP.
- id: ulga_na_dziecko_PIT
  nazwa: Ulga na dziecko w PIT (ulga prorodzinna)
  typ: uprawnienie
  instytucja: urząd skarbowy
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Masz dochody opodatkowane według skali podatkowej, np. z pracy. Forma zatrudnienia nie ma znaczenia.
    - Ulgi nie ma, jeśli masz wyłącznie dochody z podatku liniowego, ryczałtu ewidencjonowanego albo karty podatkowej.
    - Wykonujesz władzę rodzicielską, jesteś opiekunem prawnym mieszkającym z dzieckiem albo rodziną zastępczą.
    - 'Przy jednym dziecku obowiązuje limit dochodu: 112 000 zł łącznie dla małżonków albo dla osoby samotnie wychowującej
      dziecko, 56 000 zł dla osoby niebędącej w małżeństwie.'
    - Limitu nie ma przy dwojgu lub więcej dzieciach oraz przy jednym dziecku z niepełnosprawnością.
  etap: do_12_miesiecy
  etapy_dodatkowe:
  - od_12_do_36_miesiecy
  termin:
    od: null
    limit: W zeznaniu rocznym, składanym od 15 lutego do 30 kwietnia roku następnego.
    skutek_spoznienia: null
  kwota:
    opis: Odliczenie od podatku za każdy miesiąc, w którym wykonujesz władzę rodzicielską – także za miesiąc urodzenia
      dziecka.
    miesiecznie:
      pierwsze_dziecko: 92,67 zł (rocznie 1112,04 zł)
      drugie_dziecko: 92,67 zł (rocznie 1112,04 zł)
      trzecie_dziecko: 166,67 zł (rocznie 2000,04 zł)
      czwarte_i_kolejne: 225,00 zł (rocznie 2700,00 zł)
    podzial_miedzy_rodzicow: Kwota jest wspólna dla obojga rodziców. Dzielicie ją w dowolnej proporcji.
    zwrot_niewykorzystanej_ulgi: 'Jeśli podatek jest niższy niż ulga, dostajesz dodatkowy zwrot różnicy. Zwrot nie
      może przekroczyć sumy zapłaconych składek na ubezpieczenia społeczne i zdrowotne.

      '
  jak_zlozyc:
    kanaly:
    - zeznanie PIT-37 albo PIT-36 z załącznikiem PIT/O
    uwagi: 'W PIT/O podajesz liczbę dzieci i ich numery PESEL. O dodatkowy zwrot wnioskujesz w części J zeznania
      PIT-37 albo w części M zeznania PIT-36. Odpis aktu urodzenia pokazujesz tylko na żądanie urzędu.

      '
  podstawa_prawna: u_pit art. 27f ust. 1–5, 8–12; art. 45 ust. 1
  zrodlo:
  - https://podatki.gov.pl/ulgi-i-odliczenia/ulga-na-dziecko-pit
  - https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
