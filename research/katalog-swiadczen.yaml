- id: urlop_wychowawczy
  nazwa: Urlop wychowawczy
  typ: uprawnienie
  instytucja: pracodawca
  dla_kogo:
    rola:
    - oboje
    status_zawodowy:
    - etat
    warunki:
    - Tylko pracownicy. Nie dotyczy zlecenia, umowy o dzieło ani działalności gospodarczej.
    - Co najmniej 6 miesięcy zatrudnienia (liczą się też poprzednie okresy zatrudnienia).
  etap: od_12_do_36_miesiecy
  etapy_dodatkowe:
  - do_12_miesiecy
  termin:
    od: poczatek_urlopu
    limit: Wniosek co najmniej 21 dni przed rozpoczęciem urlopu.
    skutek_spoznienia: Pracodawca udziela urlopu najpóźniej z upływem 21 dni od dnia złożenia wniosku.
  kwota:
    opis: Urlop jest bezpłatny.
    okres: do 36 miesięcy łącznie dla obojga rodziców, najwyżej w 5 częściach
    do_kiedy: do końca roku kalendarzowego, w którym dziecko kończy 6 lat
    czesc_nieprzenoszalna: 1 miesiąc dla każdego z rodziców – nie można go oddać drugiemu rodzicowi.
    jeden_rodzic: Pełne 36 miesięcy dla jednego rodzica, gdy drugi nie żyje, nie ma władzy rodzicielskiej albo ją
      ograniczono lub zawieszono.
    dziecko_z_niepelnosprawnoscia: Dodatkowo do 36 miesięcy, najdłużej do 18. roku życia dziecka.
  skladki:
    emerytalne_i_rentowe: Finansuje je w całości budżet państwa za pośrednictwem ZUS, jeśli nie masz innego tytułu
      do ubezpieczeń ani ustalonego prawa do emerytury lub renty.
    zdrowotna: Opłaca ją ZUS, jeśli nie podlegasz ubezpieczeniu zdrowotnemu z innego tytułu. Oblicza ją pracodawca.
  dodatkowe_zasady:
  - Możesz wycofać wniosek najpóźniej 7 dni przed rozpoczęciem urlopu.
  - W czasie urlopu możesz pracować lub uczyć się, jeśli nie wyklucza to osobistej opieki nad dzieckiem.
  - Rezygnacja – w każdej chwili za zgodą pracodawcy albo po zawiadomieniu go najpóźniej 30 dni przed powrotem do
    pracy.
  - Zamiast urlopu możesz pracować w obniżonym wymiarze czasu pracy (rekord elastyczna_organizacja_pracy_i_praca_zdalna).
  jak_zlozyc:
    kanaly:
    - pracodawca – na papierze
    - pracodawca – elektronicznie
    uwagi: Nie ma urzędowego formularza. Pracodawca musi uwzględnić wniosek.
  urzedowy_formularz: false
  tresc_wniosku:
  - Imię i nazwisko pracownika.
  - Imię i nazwisko dziecka.
  - Okres, na który ma być udzielony urlop albo jego część.
  - Okres urlopu wychowawczego wykorzystany dotychczas na to dziecko.
  - Liczba części urlopu wykorzystanych dotychczas na to dziecko.
  zalaczniki:
  - Oświadczenie, że drugi rodzic nie będzie w tym okresie korzystać z urlopu wychowawczego, albo w jakim okresie
    będzie.
  - Kopia orzeczenia o niepełnosprawności dziecka – tylko przy urlopie dodatkowym.
  - Dokumenty o sytuacji drugiego rodzica – tylko gdy wnioskujesz o pełne 36 miesięcy dla siebie.
  podstawa_prawna: KP art. 186 § 1–10; art. 186[2]; art. 186[3]; art. 186[8]; rozp_2025 § 19; u_sus art. 9 ust.
    6 i art. 16 ust. 8; u_zdrow art. 66 ust. 1 pkt 32, art. 85 ust. 15, art. 86 ust. 1 pkt 13
  zrodlo:
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1245/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2025/322/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1474/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
  - https://www.gov.pl/web/gov/skorzystajcie-z-urlopow-rodzicielskich
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Składka zdrowotna – przepis odczytany z tekstu jednolitego z 2025 r.; sprawdzić, czy późniejsze nowelizacje
    go nie zmieniły.
  - Podstawa wymiaru składek w czasie urlopu (ważna dla przyszłej emerytury) – nieujęta w rekordzie.
- id: przerwy_na_karmienie
