  sprawdzono: 2026-11-20
  jak_zlozyc:
    kanaly:
    - PUE/eZUS
    - aplikacja mZUS
    - bankowość elektroniczna
    - portal Emp@tia
    uwagi: 'Tylko elektronicznie. Wniosek składa rodzic, najwcześniej w dniu, w którym dziecko zaczyna chodzić do
      placówki. Okres uczęszczania i opłatę ZUS pobiera sam z rejestru żłobków – placówka uzupełnia dane co miesiąc.

      '
  do_monitorowania:
  - Limit opłaty 2200 zł obowiązuje do 31 marca 2027 – nowy limit minister ogłasza w Monitorze Polskim do 31 marca.
