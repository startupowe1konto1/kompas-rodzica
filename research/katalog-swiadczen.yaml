  do_sprawdzenia: []
  wylaczenia:
  - Rodzic pozbawiony władzy rodzicielskiej.
  - Dziecko w pieczy zastępczej.
  - Na to samo dziecko za ten sam miesiąc przyznano „aktywni rodzice w pracy” albo „aktywnie w żłobku”.
  - Na dziecko przysługuje podobne świadczenie za granicą (nie dotyczy państw UE/EFTA i Wielkiej Brytanii).
  - Strona ZUS nie wymienia zasiłku macierzyńskiego jako przeszkody. Świadczenia z programu można łączyć z 800+
    i świadczeniami rodzinnymi.
- id: aktywni_rodzice_w_pracy
  nazwa: Aktywny Rodzic – świadczenie „aktywni rodzice w pracy”
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - zlecenie_bez_chorobowego
    - jdg_z_chorobowym
    - jdg_bez_chorobowego
    - rolnik_krus
    warunki:
    - Dziecko w wieku od 12. do 35. miesiąca (od pierwszego dnia miesiąca, w którym kończy 12 miesięcy, do końca
      miesiąca przed ukończeniem 36. miesiąca).
    - Dziecko NIE chodzi do żłobka, klubu dziecięcego, przedszkola ani do dziennego opiekuna.
    - Oboje rodzice (albo rodzic i osoba, z którą wspólnie wychowuje dziecko) są aktywni zawodowo – łączna podstawa
      składek emerytalno-rentowych co najmniej 100% minimalnego wynagrodzenia.
    - Każde z nich osobno – podstawa co najmniej 50% minimalnego wynagrodzenia, a 30% przy działalności na preferencyjnych
      zasadach (ulga na start, preferencyjne składki, mały ZUS plus).
    - Rodzic samodzielnie wychowujący dziecko – podstawa co najmniej 100% minimalnego wynagrodzenia (30% z ulgi
      nie wystarcza).
    - Minimalne wynagrodzenie od 1 stycznia 2026 – 4806 zł.
    - Za aktywność liczy się też pobieranie zasiłku macierzyńskiego, chorobowego, opiekuńczego lub świadczenia rehabilitacyjnego
      – ale nie po ustaniu ubezpieczenia (np. zasiłek macierzyński po zakończeniu umowy się nie liczy).
    - Ubezpieczenie w KRUS (obowiązkowe albo dobrowolne od co najmniej 12 miesięcy) i służba mundurowa liczą się
      jak 100% minimalnego wynagrodzenia.
    - Urlop bezpłatny przez cały miesiąc nie jest aktywnością zawodową.
    - Z opiekunów – opiekun faktyczny, rodzina zastępcza, prowadzący rodzinny dom dziecka. Opiekun prawny nie może
      złożyć wniosku.
    - Nie przysługuje obywatelom Ukrainy ze statusem UKR.
  etap: od_12_do_36_miesiecy
  termin:
    od: ukonczenie_12_miesiecy
    limit: Wniosek najwcześniej w miesiącu, w którym dziecko kończy 12. miesiąc – wcześniej nie można. Najlepiej
      złożyć go w tym właśnie miesiącu.
    skutek_spoznienia: 'Świadczenie przysługuje od miesiąca, w którym wpłynął wniosek. Nie ma wyrównania wstecz.
      Każdy miesiąc zwłoki to 1500 zł mniej (1900 zł przy dziecku z niepełnosprawnością).

      '
  kwota:
    opis: 1500 zł miesięcznie na dziecko; 1900 zł, jeśli dziecko ma orzeczenie o niepełnosprawności z dwoma wskazaniami
      (stała opieka innej osoby oraz stały współudział opiekuna w leczeniu, rehabilitacji i edukacji)
    uwagi: 'Kwota miesięczna jest niepodzielna – za niepełny miesiąc należy się cała. Przy opiece naprzemiennej
      po połowie: 750 zł albo 950 zł. Bez podatku i składek. Orzeczenia nie trzeba dołączać – we wniosku wpisuje
      się jego numer.

      '
  jak_zlozyc:
    kanaly:
    - PUE/eZUS
    - aplikacja mZUS
    - bankowość elektroniczna
    - portal Emp@tia
    uwagi: 'Tylko elektronicznie. We wniosku składasz oświadczenie, czy wychowujesz dziecko sam(a), czy z drugą
      osobą, i podajesz jej dane oraz dane o jej pracy. Nie trzeba rozliczać, na co poszły pieniądze, ani pokazywać
      umowy z nianią.

      '
  zrodlo:
  - https://www.zus.pl/aktywnyrodzic/swiadczenie-aktywni-rodzice-w-pracy
  - https://www.zus.pl/baza-wiedzy/aktywnyrodzic/pytania-i-odpowiedzi
  - https://www.zus.pl/baza-wiedzy/skladki-wskazniki-odsetki/wskazniki/minimalne-i-przecietne-wynagrodzenie
  - https://api.sejm.gov.pl/eli/acts/DU/2026/532/text.pdf
  - https://www.zus.pl/mzus
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  przerwa_w_aktywnosci: 'Gdy Ty albo drugi rodzic przestajecie spełniać warunek aktywności, świadczenie przysługuje
    jeszcze do końca następnego miesiąca. Z tej ochrony można skorzystać 2 razy na dane dziecko. Przy kolejnej przerwie
    prawo wygasa i potrzebny jest nowy wniosek. ZUS sprawdza warunek co miesiąc. Zwolnienie lekarskie i opieka nad
    chorym dzieckiem nie przerywają prawa.

    '
  do_monitorowania:
  - Minimalne wynagrodzenie na 2027 r. – strona ZUS podaje na razie tylko 4806 zł od 1.01.2026. Progi 50% i 30%
    (2403 zł i 1441,80 zł) to własne wyliczenie z tej kwoty.
  - Jak ZUS liczy pracę drugiego rodzica za granicą (strona pytań i odpowiedzi – „na etapie uzgodnień z MRPiPS”).
  do_sprawdzenia: []
- id: aktywnie_w_zlobku
  nazwa: Aktywny Rodzic – świadczenie „aktywnie w żłobku”
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Dziecko chodzi do żłobka lub klubu dziecięcego wpisanego do rejestru albo jest pod opieką dziennego opiekuna
      z wykazu. Przedszkole się nie liczy.
    - Bez względu na dochód i bez warunku pracy.
    - Opłata za pobyt (bez wyżywienia) nie przekracza 2200 zł miesięcznie – przy wyższej opłacie świadczenie nie
      przysługuje wcale.
    - Także opiekun prawny, rodzina zastępcza i inne osoby, którym sąd powierzył opiekę nad dzieckiem.
    - Na to samo dziecko w danym miesiącu tylko jedno świadczenie z programu Aktywny Rodzic.
  etap: do_12_miesiecy
  termin:
    od: rozpoczecie_uczeszczania_do_zlobka
    limit: 2 miesiące
    skutek_spoznienia: 'Wniosek w ciągu 2 miesięcy od pierwszego dnia w żłobku – świadczenie od tego dnia. Później
      – dopiero od miesiąca złożenia wniosku. Za wcześniejsze miesiące płacisz pełną opłatę sam(a): strata do 1500
      zł (1900 zł) za każdy miesiąc.

      '
  kwota:
    opis: do 1500 zł miesięcznie na dziecko (do 1900 zł przy orzeczeniu o niepełnosprawności z dwoma wskazaniami),
      nie więcej niż opłata rodzica za pobyt dziecka – bez wyżywienia
    sposob_wyplaty: 'Pieniądze NIE trafiają do rodzica. ZUS przelewa je na rachunek żłobka, klubu dziecięcego albo
      dziennego opiekuna, do 20. dnia miesiąca za miesiąc poprzedni. Rodzic płaci placówce odpowiednio mniej.

      '
    uwagi: Kwota nie zależy od dnia miesiąca, w którym dziecko zaczęło chodzić do żłobka – liczy się opłata wpisana
      przez placówkę do rejestru.
  zrodlo:
  - https://www.zus.pl/aktywnyrodzic/wiadczenie-aktywnie-w-zlobku
