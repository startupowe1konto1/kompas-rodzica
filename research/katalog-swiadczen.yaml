  do_sprawdzenia:
  - Czy osoba na zleceniu albo z działalnością może pracować w czasie zasiłku za okres urlopu rodzicielskiego i
    jak wpływa to na zasiłek – przepisy tego nie regulują, źródła ZUS milczą.
  - Zawartość wniosku („wymiar pracy i okres łączenia”) – z Komentarza ZUS z 2023 r. (pkt 141) i art. 182(1f) §
    6 KP.
- id: zasilek_rodzinny_i_dodatki
  nazwa: Zasiłek rodzinny z dodatkami (w tym dodatek z tytułu urodzenia dziecka)
  typ: swiadczenie
  instytucja: gmina
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Dochód na osobę w rodzinie nie przekracza 674 zł netto miesięcznie (764 zł, gdy w rodzinie jest dziecko z
      niepełnosprawnością). Liczy się dochód z roku przed okresem zasiłkowym.
    - Przy niewielkim przekroczeniu progu działa zasada „złotówka za złotówkę” – świadczenia są pomniejszane o kwotę
      przekroczenia; jeśli wyjdzie mniej niż 20 zł, nie przysługują.
    - Dodatek z tytułu urodzenia dziecka – tylko razem z zasiłkiem rodzinnym; matka musiała być pod opieką medyczną
      najpóźniej od 10. tygodnia ciąży do porodu (zaświadczenie od lekarza lub położnej).
    - Osoba samotnie wychowująca dziecko musi mieć zasądzone alimenty od drugiego rodzica (wyjątki m.in. gdy rodzic
      nie żyje, ojciec jest nieznany, sąd oddalił powództwo, jest opieka naprzemienna).
    - Nie przysługuje, gdy dziecko jest w pieczy zastępczej albo w placówce z pełnym utrzymaniem.
  etap: do_3_miesiecy
  termin:
    od: porod
    limit: 'Zasiłek – bez sztywnego terminu, ale przysługuje dopiero od miesiąca złożenia wniosku. Dodatek z tytułu
      urodzenia dziecka – wniosek do ukończenia przez dziecko 1. roku życia.

      '
    skutek_spoznienia: 'Zasiłek i dodatki miesięczne nie są wyrównywane wstecz – każdy miesiąc zwłoki to stracone
      95 zł zasiłku plus dodatki. Po pierwszych urodzinach dziecka przepada dodatek z tytułu urodzenia – 1000 zł.

      '
  kwota:
    opis: 95 zł miesięcznie na dziecko do 5 lat (124 zł w wieku 5–18 lat, 135 zł w wieku 18–24 lat)
    dodatki:
      urodzenie_dziecka: 1000 zł jednorazowo na każde dziecko – to inne świadczenie niż becikowe (osobny przepis,
        warunkiem jest prawo do zasiłku rodzinnego)
      opieka_w_czasie_urlopu_wychowawczego: 400 zł miesięcznie, do 24 miesięcy (36 przy wieloraczkach, 72 przy dziecku
        z niepełnosprawnością); wymaga co najmniej 6 miesięcy pracy przed urlopem; nie łączy się z zasiłkiem macierzyńskim
        ani świadczeniem rodzicielskim
      samotne_wychowywanie: 193 zł miesięcznie na dziecko, najwyżej 386 zł na wszystkie dzieci (plus 80 zł na dziecko
        z niepełnosprawnością, najwyżej 160 zł)
      rodzina_wielodzietna: 95 zł miesięcznie na trzecie i każde kolejne dziecko
    zlotowka_za_zlotowke: 'Jeśli dochód rodziny przekracza próg (674 zł albo 764 zł razy liczba osób) o kwotę nie
      większą niż łączna suma należnych zasiłków z dodatkami, rodzina dostaje różnicę między tą sumą a kwotą przekroczenia.
      Ustala to gmina.

      '
  okres_zasilkowy:
    opis: Od 1 listopada do 31 października. Wniosek składa się co roku.
    terminy:
    - Wnioski na nowy okres – od 1 lipca przez internet, od 1 sierpnia na papierze.
    - Wniosek do 31 sierpnia – wypłata do 30 listopada.
    - Wniosek we wrześniu lub październiku – wypłata do 31 grudnia.
    - Wniosek w listopadzie lub grudniu – wypłata do końca lutego.
    - Wniosek w trakcie okresu (np. po urodzeniu dziecka) – zasiłek od miesiąca złożenia do 31 października.
  jak_zlozyc:
    kanaly:
    - portal Emp@tia
    - urząd gminy lub ośrodek pomocy społecznej
    - pocztą
    uwagi: 'Emp@tia wymaga profilu zaufanego albo podpisu kwalifikowanego. Wniosek rozpatruje gmina właściwa dla
      miejsca zamieszkania. Potrzebne: numery PESEL członków rodziny, dane o dochodach, numer rachunku; przy dodatku
      z tytułu urodzenia – zaświadczenie o opiece medycznej w ciąży. Decyzja w ciągu miesiąca (w trudnych sprawach
      – dwóch). O wzroście dochodu ponad próg trzeba zawiadomić urząd.

      '
  powiazane:
  - becikowe
  - swiadczenie_rodzicielskie
  uwagi_dla_aplikacji: 'Próg 674 zł na osobę jest bardzo niski – rekord pokazywać po pytaniu o dochód. Dodatek z
    tytułu urodzenia (1000 zł) ma ten sam warunek opieki medycznej od 10. tygodnia ciąży co becikowe.

    '
  zrodlo:
  - https://www.gov.pl/web/gov/uzyskaj-zasilek-rodzinny-wraz-z-dodatkami
  - https://www.gov.pl/web/rodzina/zasilek-rodzinny
  - https://api.sejm.gov.pl/eli/acts/DU/2024/1238/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1240/text.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
- id: swiadczenie_za_zyciem
  nazwa: Jednorazowe świadczenie 4000 zł „Za życiem”
  typ: swiadczenie
  instytucja: gmina
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Dziecko urodziło się żywe i ma stwierdzone ciężkie i nieodwracalne upośledzenie albo nieuleczalną chorobę
      zagrażającą życiu, które powstały w okresie prenatalnym lub w czasie porodu.
    - Zaświadczenie lekarskie potwierdzające ten stan – wystawia lekarz ubezpieczenia zdrowotnego ze specjalizacją
      II stopnia albo specjalista położnictwa i ginekologii, perinatologii, neonatologii, neurologii dziecięcej,
      kardiologii dziecięcej lub chirurgii dziecięcej.
    - Matka była pod opieką medyczną najpóźniej od 10. tygodnia ciąży do porodu (zaświadczenie od lekarza lub położnej).
      Nie dotyczy opiekunów i rodziców adopcyjnych.
    - Bez względu na dochód.
  etap: do_12_miesiecy
  termin:
    od: porod
    limit: 12 miesięcy
    skutek_spoznienia: Wniosek złożony po terminie nie jest rozpatrywany – świadczenie 4000 zł przepada.
  kwota:
    opis: 4000 zł jednorazowo, niezależnie od dochodu
  jak_zlozyc:
    kanaly:
    - portal Emp@tia
    - urząd gminy lub ośrodek pomocy społecznej
    - pocztą
    uwagi: 'Emp@tia wymaga profilu zaufanego albo podpisu kwalifikowanego. Wniosek rozpatruje gmina właściwa dla
      miejsca zamieszkania. Decyzja w ciągu miesiąca (w trudnych sprawach – dwóch). Odwołanie w 14 dni do samorządowego
      kolegium odwoławczego. Dla opiekunów i rodziców adopcyjnych termin 12 miesięcy liczy się od objęcia dziecka
      opieką lub przysposobienia.

      '
  powiazane:
  - becikowe
  uwagi_dla_aplikacji: 'Temat trudny emocjonalnie – pokazywać tylko wtedy, gdy rodzic sam zaznaczy ciężką chorobę
    lub niepełnosprawność dziecka. Warunek opieki medycznej od 10. tygodnia ciąży jest ten sam co przy becikowym.

    '
  zrodlo:
  - https://www.gov.pl/web/gov/uzyskaj-jednorazowe-swiadczenie-w-wysokosci-4000-zl
  - https://api.sejm.gov.pl/eli/acts/DU/2024/1829/text.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
- id: zgloszenie_dziecka_do_ubezpieczenia_zdrowotnego
  nazwa: Zgłoszenie dziecka do ubezpieczenia zdrowotnego
  typ: formalnosc
  instytucja: pracodawca
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Zgłasza rodzic, który sam ma ubezpieczenie zdrowotne. Wystarczy zgłoszenie przez jedno z rodziców.
    - Jeśli żadne z rodziców nie jest ubezpieczone, dziecko może zgłosić babcia lub dziadek.
    - Rejestracja urodzenia w USC NIE zgłasza dziecka do ubezpieczenia – trzeba to zrobić osobno.
  etap: porod_do_21_dni
  termin:
    od: nadanie_numeru_PESEL
    limit: 7 dni
    skutek_spoznienia: 'Strony źródłowe nie podają kary. Dziecko z polskim obywatelstwem ma prawo do bezpłatnego
      leczenia także bez zgłoszenia, a do końca 3. miesiąca życia – gdy nie ma jeszcze numeru PESEL – przychodnia
      potwierdza to prawo numerem PESEL rodzica. Zgłoszenie jest jednak obowiązkiem rodzica i porządkuje dane dziecka
      w systemie (m.in. dostęp do konta dziecka w IKP).

      '
  kwota: null
  jak_zlozyc:
    kanaly:
    - pracodawca lub zleceniodawca
    - ZUS na formularzu ZUS ZCNA
    - urząd pracy
    uwagi: 'Pracujesz na etacie lub zleceniu – przekaż dane dziecka pracodawcy albo zleceniodawcy, to on zgłasza.
      Prowadzisz firmę – sam(a) składasz w ZUS formularz ZUS ZCNA. Jesteś zarejestrowana(-y) jako bezrobotna(-y)
      – zgłaszasz w urzędzie pracy. Ubezpieczasz się dobrowolnie – najpierw wniosek w NFZ, potem ZUS ZCNA. Za zgłoszone
      dziecko nie płaci się dodatkowej składki. Po każdej zmianie pracy lub formy zatrudnienia dziecko trzeba zgłosić
      od nowa. Konto dziecka w Internetowym Koncie Pacjenta podłącza się automatycznie do rodzica, który zgłosił
      dziecko.

      '
  zrodlo:
  - https://pacjent.gov.pl/aktualnosc/zglos-dziecko-do-ubezpieczenia
  - https://pacjent.gov.pl/artykul/jak-ubezpieczyc-czlonka-rodziny
  - https://www.zus.pl/pracujacy/ubezpieczenie-zdrowotne-w-polsce/zasady-podlegania-ubezpieczeniu-zdrowotnemu/ubezpieczenie-czlonkow-rodziny
  - https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Od kiedy liczyć 7 dni – pacjent.gov.pl mówi „od nadania dziecku numeru PESEL”, ZUS i ustawa „od zaistnienia
    okoliczności”. W aplikacji przyjąć bezpieczniej – od nadania PESEL, czyli od rejestracji w USC.
  - Czy za spóźnienie grozi jakakolwiek sankcja – żadna z trzech stron tego nie opisuje.
  - Zgłoszenie przez rodzica ubezpieczonego w KRUS oraz przez studenta (uczelnia) – nie sprawdzono.
  - Tekst jednolity ustawy (Dz.U. 2025 poz. 1461) ma późniejsze nowelizacje – sprawdzono tylko brzmienie z tekstu
    jednolitego.
- id: uznanie_ojcostwa
  nazwa: Uznanie ojcostwa (rodzice bez ślubu)
  typ: formalnosc
  instytucja: USC
  dla_kogo:
    rola:
    - oboje
    status_zawodowy: wszystkie
    warunki:
    - Dotyczy rodziców, którzy nie są małżeństwem – mąż matki jest ojcem z mocy prawa i niczego nie składa.
    - Ojciec oświadcza przed kierownikiem USC, że jest ojcem dziecka, a matka to potwierdza – od razu albo w ciągu
      3 miesięcy.
    - Można to zrobić już w czasie ciąży, zanim dziecko się urodzi.
    - Oświadczenie może złożyć osoba, która skończyła 16 lat; kto nie ma pełnej zdolności do czynności prawnych
      – tylko przed sądem opiekuńczym.
    - Nie można uznać ojcostwa, gdy toczy się sprawa sądowa o jego ustalenie, ani po ukończeniu przez dziecko 18
      lat.
  etap: ciaza
  termin:
    od: poczatek_ciazy
    limit: Bez terminu (najpóźniej do pełnoletności dziecka). Najwygodniej przed porodem albo przed zgłoszeniem
      urodzenia.
    skutek_spoznienia: 'Bez uznania ojciec nie zgłosi urodzenia dziecka, a w akcie urodzenia jako dane ojca wpisuje
      się imię wskazane przez zgłaszającego i nazwisko matki, z adnotacją. Uznania można dokonać później – to nie
      przepada.

      '
  kwota: null
  jak_zlozyc:
    kanaly:
    - dowolny USC osobiście
    - konsul RP za granicą
    - sąd opiekuńczy
    uwagi: 'Oboje rodzice składają oświadczenia osobiście; kierownik USC spisuje protokół, który podpisują rodzice
      i kierownik. USC, który przyjął oświadczenia, sam przesyła protokół do urzędu sporządzającego akt urodzenia.
      Kierownik USC może odmówić, gdy ma wątpliwości co do pochodzenia dziecka – wtedy zostaje droga sądowa. Przy
      uznaniu rodzice składają też oświadczenia o nazwisku dziecka.

      '
  efekt: Dane ojca trafiają do aktu urodzenia. Ojciec może sam zgłosić urodzenie dziecka w USC.
  odblokowuje:
  - zgloszenie_urodzenia
  zrodlo:
  - https://www.gov.pl/web/gov/zglos-urodzenie-dziecka
  - https://api.sejm.gov.pl/eli/acts/DU/2026/236/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2026/393/text.pdf
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Jakie dokumenty zabrać do USC (dowody osobiste; przy uznaniu przed porodem – zaświadczenie o ciąży lub karta
    ciąży). Nie ma centralnej strony usługi na gov.pl – opisują to tylko strony gmin.
  - Czy czynność jest bezpłatna (z pamięci – tak, bez opłaty skarbowej; nie potwierdzono w źródle).
  - Czy trzeba umawiać wizytę i czy da się to zrobić online (z pamięci – tylko osobiście).
- id: przygotuj_sie_zawczasu
  nazwa: Przygotuj się przed porodem – konta i narzędzia do spraw online
  typ: formalnosc
  instytucja: inne
  dla_kogo:
    rola:
    - oboje
    status_zawodowy: wszystkie
    warunki:
    - Wszystko jest bezpłatne i da się załatwić bez wychodzenia z domu. Warto zrobić to w ciąży – po porodzie terminy
      biegną szybko.
  etap: ciaza
  termin:
    od: poczatek_ciazy
    limit: Przed porodem
    skutek_spoznienia: 'Nic nie przepada, ale bez adresu do e-Doręczeń nie zgłosisz urodzenia przez internet ani
      w mObywatelu (zostaje wizyta w USC), a bez profilu zaufanego nie złożysz wniosków przez Emp@tię.

      '
  kwota: null
  kroki:
  - nazwa: Profil zaufany
    po_co: Logowanie i podpis w gov.pl, Emp@tii, eZUS i Internetowym Koncie Pacjenta. Potrzebny do becikowego, świadczenia
      rodzicielskiego i zasiłku rodzinnego przez Emp@tię oraz do zgłoszenia urodzenia online.
    jak: Zakładasz bezpłatnie na pz.gov.pl.
    zrodlo: https://www.gov.pl/web/gov/zaloz-profil-zaufany
  - nazwa: Adres i skrzynka do e-Doręczeń
    po_co: Od 1.01.2026 zgłoszenie urodzenia przez internet działa tylko z e-Doręczeniami; wymaga ich też zgłoszenie
      w mObywatelu. Na skrzynkę przychodzi potwierdzenie i dokumenty dziecka.
    jak: 'Bezpłatny wniosek na edoreczenia.gov.pl – logujesz się profilem zaufanym, e-dowodem, bankowością elektroniczną,
      mObywatelem lub eID. Po akceptacji wniosku skrzynkę trzeba jeszcze AKTYWOWAĆ w serwisie mObywatel.gov.pl (Twoje
      skrzynki → Aktywuj skrzynkę).

      '
    zrodlo: https://www.gov.pl/web/gov/uzyskaj-adres-do-e-doreczen-u-publicznego-dostawcy-uslugi-e-doreczen
  - nazwa: Konto eZUS (dawniej PUE ZUS)
    po_co: Tu ZUS wysyła informacje i decyzje o 800+ i Aktywnym Rodzicu; tu też składa się wnioski o zasiłki.
    jak: 'Rejestracja na zus.pl przez login.gov.pl (profil zaufany, bank, mObywatel, e-dowód) albo podczas e-wizyty
      lub w placówce ZUS. Nie jest to warunek konieczny – gdy złożysz wniosek o 800+ lub Aktywnego Rodzica przez
      bank albo Emp@tię i nie masz konta, ZUS założy je sam.

      '
    zrodlo: https://www.zus.pl/baza-wiedzy/o-portalu-pue-/jak-zarejestrowac-konto-na-pue
  - nazwa: Aplikacja mObywatel z mDowodem
    po_co: Zgłoszenie urodzenia dziecka w telefonie (od 5.03.2026) – wymaga mDowodu, profilu zaufanego i aktywnej
      skrzynki e-Doręczeń.
    jak: Aplikację aktywujesz e-dowodem (kod PIN1 i telefon z NFC), a bez e-dowodu – profilem zaufanym albo bankowością
      elektroniczną.
    zrodlo: https://info.mobywatel.gov.pl/aktualnosci/zglos-urodzenie-dziecka-w-mObywatelu
  - nazwa: Aplikacja mZUS (opcjonalnie)
    po_co: Wnioski o 800+ i Aktywnego Rodzica z telefonu oraz podgląd ich statusu i wypłat.
    jak: Pobierz tylko z Google Play albo App Store.
    zrodlo: https://www.zus.pl/mzus
  jak_zlozyc:
    kanaly:
    - online
    uwagi: Kolejność – najpierw profil zaufany, potem e-Doręczenia i mObywatel; konto eZUS na końcu albo wcale.
  odblokowuje:
  - zgloszenie_urodzenia
  - swiadczenie_800_plus
  - becikowe
  - swiadczenie_rodzicielskie
  - zasilek_rodzinny_i_dodatki
  zrodlo:
  - https://www.gov.pl/web/gov/zaloz-profil-zaufany
  - https://www.gov.pl/web/gov/uzyskaj-adres-do-e-doreczen-u-publicznego-dostawcy-uslugi-e-doreczen
  - https://www.gov.pl/web/gov/zglos-urodzenie-dziecka
  - https://www.zus.pl/baza-wiedzy/o-portalu-pue-/jak-zarejestrowac-konto-na-pue
  - https://www.zus.pl/swiadczenia/swiadczenia-dla-rodzin/swiadczenie-wychowawcze-800-plus
  - https://info.mobywatel.gov.pl/aktualnosci/zglos-urodzenie-dziecka-w-mObywatelu
  - https://www.gov.pl/web/cyfryzacja/aktywacja-mobywatela-z-e-dowodem-to-proste
  - https://www.zus.pl/mzus
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Sposoby założenia profilu zaufanego (bank, e-dowód, mObywatel, wideorozmowa, punkt potwierdzający) – strona
    główna PZ mówi tylko, że jest bezpłatny i zakłada się go na pz.gov.pl.
  - Czy aplikacja mZUS wymaga wcześniejszego konta eZUS – strona mZUS tego nie rozstrzyga.
  - Aktywacja mObywatela profilem zaufanym lub bankiem – z wyniku wyszukiwarki, nie z treści przeczytanej strony
    (przeczytano tylko ścieżkę z e-dowodem).
- id: becikowe_samorzadowe
  nazwa: Lokalne „becikowe” od gminy lub województwa
  typ: swiadczenie
  instytucja: gmina
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy: wszystkie
    warunki:
    - Część gmin i województw wypłaca własne, dodatkowe świadczenie z tytułu urodzenia dziecka – zasady, kwoty i
      terminy ustala samorząd, więc trzeba zapytać w swoim urzędzie gminy.
  etap: do_12_miesiecy
  termin: null
  kwota: null
  jak_zlozyc:
    kanaly:
    - urząd gminy lub ośrodek pomocy społecznej
    uwagi: Świadczenie lokalne – nie wszędzie istnieje.
  zrodlo: []
  weryfikacja: do_weryfikacji
  sprawdzono: null
  do_sprawdzenia:
  - Rekord lokalny i niezweryfikowany – wpisany z pamięci, bez źródła urzędowego. Nie podawać w aplikacji kwot ani
    listy gmin.
- id: ochrona_przed_zwolnieniem
  nazwa: Ochrona przed zwolnieniem w ciąży i w czasie urlopów rodzicielskich
  typ: uprawnienie
  instytucja: pracodawca
  dla_kogo:
    rola:
    - matka
    - ojciec
    status_zawodowy:
    - etat
    warunki:
    - Tylko pracownicy. Nie dotyczy zlecenia, umowy o dzieło ani działalności gospodarczej.
    - Ciążę potwierdza zaświadczenie lekarskie.
    - Ojca i drugiego rodzica chroni złożenie wniosku o urlop ojcowski, rodzicielski albo o część urlopu macierzyńskiego.
  etap: ciaza
  etapy_dodatkowe:
  - porod_do_21_dni
  - do_3_miesiecy
  - do_12_miesiecy
  termin:
    od: poczatek_ciazy
    limit: Ochrona trwa przez całą ciążę i urlop macierzyński, a po złożeniu wniosku o urlop – do dnia zakończenia
      tego urlopu.
    skutek_spoznienia: null
  kwota: null
  zakres:
    zakaz: Pracodawca nie może wypowiedzieć ani rozwiązać umowy. Nie może też przygotowywać się do zwolnienia.
    wyjatki:
    - Rozwiązanie umowy bez wypowiedzenia z winy pracownika, jeśli zgodzi się na to zakładowa organizacja związkowa.
    - Wypowiedzenie przy ogłoszeniu upadłości lub likwidacji pracodawcy.
    ciezar_dowodu: Istnienie tych przyczyn musi udowodnić pracodawca.
    ochrona_od_wniosku_o_urlop: 'Ochrona zaczyna się w dniu złożenia wniosku. Jeśli złożysz wniosek wcześniej, niż
      wymaga Kodeks, ochrona zaczyna się 14 dni przed częścią urlopu macierzyńskiego, 21 dni przed urlopem rodzicielskim
      albo uzupełniającym urlopem macierzyńskim i 7 dni przed urlopem ojcowskim.

      '
    umowa_na_czas_okreslony: 'Umowa na czas określony albo na okres próbny dłuższy niż miesiąc, która skończyłaby
      się po upływie 3. miesiąca ciąży, przedłuża się do dnia porodu. Nie dotyczy to umowy na zastępstwo.

      '
    okres_probny: 'Zakaz wypowiedzenia obowiązuje także na okresie próbnym (art. 177 nie zawiera wyjątku, § 2 jest
      uchylony). Umowa na okres próbny do miesiąca nie przedłuża się do porodu.

      '
    zasilek_po_przedluzonej_umowie: Po umowie przedłużonej do dnia porodu przysługuje zasiłek macierzyński, mimo
      że ubezpieczenie ustało.
    urlop_wychowawczy: 'Ochrona trwa od złożenia wniosku o urlop wychowawczy do końca urlopu, najwcześniej od 21
      dni przed jego początkiem. Przy wniosku o obniżenie wymiaru czasu pracy – łącznie najwyżej 12 miesięcy.

      '
    powrot_do_pracy: Po urlopie pracodawca dopuszcza pracownika do pracy na dotychczasowym albo równorzędnym stanowisku,
      na warunkach nie gorszych niż bez urlopu.
  jak_zlozyc:
    kanaly:
    - pracodawca
    uwagi: Ochrona działa z mocy prawa, bez wniosku. Przekaż pracodawcy zaświadczenie lekarskie o ciąży.
  podstawa_prawna: KP art. 177 § 1, § 1[1], § 3, § 3[1], § 4, § 4[1]; art. 185 § 1; art. 186[4]; art. 186[8]; u_zas
    art. 30 ust. 4
  zrodlo:
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1245/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2026/854/text.pdf
  - https://www.gov.pl/web/gov/skorzystajcie-z-urlopow-rodzicielskich
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
- id: warunki_pracy_w_ciazy
  nazwa: Warunki pracy w ciąży – bez nadgodzin, pracy w nocy i prac wzbronionych
  typ: uprawnienie
  instytucja: pracodawca
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - etat
    warunki:
    - Tylko pracownice. Nie dotyczy zlecenia, umowy o dzieło ani działalności gospodarczej.
    - Część zakazów obejmuje też pracownice karmiące piersią.
  etap: ciaza
  etapy_dodatkowe:
  - porod_do_21_dni
  - do_3_miesiecy
  - do_12_miesiecy
  termin:
    od: poczatek_ciazy
    limit: do końca ciąży (prace wzbronione – także w czasie karmienia piersią)
    skutek_spoznienia: null
  kwota: null
  zakres:
    zakazy_bezwzgledne:
    - Praca w godzinach nadliczbowych.
    - Praca w porze nocnej.
    tylko_za_zgoda_pracownicy:
    - Delegowanie poza stałe miejsce pracy.
    - Praca w systemie przerywanego czasu pracy.
    czas_pracy: W systemach z przedłużonym dobowym wymiarem czasu pracy (równoważny, ruch ciągły, skrócony tydzień,
      praca weekendowa) pracownica w ciąży pracuje najwyżej 8 godzin na dobę. Za czas nieprzepracowany z tego powodu
      zachowuje wynagrodzenie.
    praca_nocna: 'Pracodawca zmienia rozkład czasu pracy tak, by praca wypadała poza porą nocną. Jeśli się nie da,
      przenosi pracownicę do innej pracy, a w ostateczności zwalnia ją z obowiązku świadczenia pracy.

      '
    prace_wzbronione: 'Przy pracy wzbronionej pracodawca przenosi pracownicę do innej pracy albo zwalnia ją z obowiązku
      świadczenia pracy. Przy pozostałych pracach z wykazu dostosowuje warunki albo skraca czas pracy.

      '
    wynagrodzenie: 'Jeśli zmiana obniża wynagrodzenie, przysługuje dodatek wyrównawczy. W czasie zwolnienia z obowiązku
      świadczenia pracy pracownica zachowuje dotychczasowe wynagrodzenie.

      '
    przyklady_z_wykazu_dla_ciazy:
    - Praca przy monitorze ekranowym łącznie ponad 8 godzin na dobę. Jednorazowo najwyżej 50 minut, potem co najmniej
      10 minut przerwy wliczanej do czasu pracy.
    - Praca w pozycji stojącej łącznie ponad 3 godziny na zmianę. Jednorazowo najwyżej 15 minut, potem 15 minut
      przerwy.
    - Ręczne podnoszenie i przenoszenie przedmiotów o masie ponad 3 kg.
    - Praca w pozycji wymuszonej.
    zaswiadczenie_lekarskie: Te same obowiązki pracodawcy powstają, gdy przeciwwskazania do dotychczasowej pracy
      wynikają z orzeczenia lekarskiego.
    rodzic_dziecka_do_8_lat: Pracownika wychowującego dziecko do 8. roku życia nie wolno bez jego zgody zatrudniać
      w nadgodzinach, w nocy, w systemie przerywanym ani delegować.
  jak_zlozyc:
    kanaly:
    - pracodawca
    uwagi: Bez wniosku. Zakazy obowiązują pracodawcę, odkąd wie o ciąży z zaświadczenia lekarskiego.
  podstawa_prawna: KP art. 148 pkt 2; art. 176; art. 178 § 1 i 2; art. 178[1]; art. 179 § 1–6; rozp_2017 załącznik
    cz. I ust. 1
  zrodlo:
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1245/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2017/796/text.pdf
  weryfikacja: potwierdzone
  sprawdzono: 2026-11-20
  do_sprawdzenia: []
- id: zwolnienie_na_badania_w_ciazy
  nazwa: Płatne zwolnienie z pracy na badania lekarskie w ciąży
  typ: uprawnienie
  instytucja: pracodawca
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
