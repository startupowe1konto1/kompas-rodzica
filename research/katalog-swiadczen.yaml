    warunki:
    - Tylko pracownice. Nie dotyczy zlecenia, umowy o dzieło ani działalności gospodarczej.
    - Badania zalecił lekarz w związku z ciążą.
    - Badań nie da się przeprowadzić poza godzinami pracy.
  etap: ciaza
