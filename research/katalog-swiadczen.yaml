  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Podstawa wymiaru (pkt 321), zakres zasiłku (pkt 134, 160) i skutek spóźnionego wniosku o część rodzicielską
    (pkt 140) pochodzą z Komentarza ZUS z sierpnia 2023 r. – potwierdzić aktualność.
  - Podstawa wymiaru, gdy urlop wychowawczy trwał krócej niż 12 miesięcy przed porodem – nie odczytano.
  - Kto wypłaca zasiłek i jaki formularz składa pracownica na urlopie wychowawczym – źródła nie opisują tego przypadku
    osobno.
  - Co dzieje się z urlopem wychowawczym po porodzie (przerwanie, powrót) – poza zakresem tej części.
- id: zasilek_opiekunczy
  nazwa: Zasiłek opiekuńczy – chore dziecko, zamknięty żłobek, pierwsze tygodnie po porodzie
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    - ojciec
    - opiekun
    status_zawodowy:
    - etat
    - zlecenie_z_chorobowym
    - jdg_z_chorobowym
    warunki:
    - Ubezpieczenie chorobowe. Bez okresu wyczekiwania – zasiłek przysługuje od pierwszego dnia ubezpieczenia.
    - Chore dziecko do 14 lat (zwolnienie e-ZLA na opiekę wystawia lekarz).
    - Zdrowe dziecko do 8 lat – nieprzewidziane zamknięcie żłobka, klubu dziecięcego, przedszkola lub szkoły (zawiadomienie
      na mniej niż 7 dni przed zamknięciem), choroba niani albo dziennego opiekuna, izolacja dziecka, a także poród,
      choroba lub pobyt w szpitalu rodzica, który stale opiekuje się dzieckiem.
    - Zasiłek dostaje jedno z rodziców – to, które złoży wniosek.
    - Nie przysługuje, gdy w domu jest inny członek rodziny, który może zająć się dzieckiem. Wyjątek – chore dziecko
      do 2 lat.
    - Nie przysługuje w czasie urlopu wychowawczego ani bezpłatnego.
    - Dodatkowy zasiłek opiekuńczy do 8 tygodni – dla ubezpieczonego ojca albo innego członka najbliższej rodziny,
      gdy matka pobierająca zasiłek macierzyński w ciągu 8 tygodni po porodzie leży w szpitalu, ma orzeczenie o
      niezdolności do samodzielnej egzystencji albo porzuciła dziecko. Trzeba przerwać pracę. Przysługuje najdłużej
      do ukończenia przez dziecko 8 tygodni życia.
  etap: do_12_miesiecy
  uwagi_dla_aplikacji: 'Rekord dotyczy kilku etapów: dodatkowy zasiłek – pierwsze 8 tygodni po porodzie; choroba
    dziecka – cały okres; zamknięty żłobek – głównie od 12. do 36. miesiąca.'
  termin:
    od: null
    limit: 6 miesięcy od ostatniego dnia okresu, za który zasiłek przysługuje
    skutek_spoznienia: Po tym terminie zasiłek przepada (roszczenie się przedawnia). Samo zwolnienie lekarskie nie
      wystarczy – trzeba złożyć wniosek.
  kwota:
    opis: 80% podstawy wymiaru za każdy dzień opieki, także za dni wolne od pracy. Podstawę liczy się jak przy zasiłku
      chorobowym.
    okres:
      dziecko_zdrowe_do_8_lat_lub_chore_do_14_lat: 60 dni w roku kalendarzowym
      dziecko_powyzej_14_lat_lub_inny_chory_czlonek_rodziny: 14 dni w roku kalendarzowym
      dziecko_z_niepelnosprawnoscia_do_18_lat: 30 dni w roku kalendarzowym (chore po 14. roku życia albo – po 8.
        roku życia – gdy stały opiekun rodzi, choruje lub jest w szpitalu)
      lacznie: Najwyżej 60 dni w roku na wszystkie dzieci i członków rodziny razem, bez względu na liczbę dzieci
        i osób uprawnionych.
      dodatkowy_po_porodzie: Do 8 tygodni; nie wlicza się do limitu 60 ani 14 dni.
  jak_zlozyc:
    kanaly:
    - pracodawca
    - zleceniodawca
    - PUE/eZUS
    uwagi: 'Wniosek Z-15 (od 24.10.2026 zastąpił Z-15A i Z-15B). Przy zamkniętym żłobku lub chorej niani – własne
      oświadczenie (formularz ZAS-36: opieka nad dzieckiem do 8 lat). Dodatkowy zasiłek po porodzie – oświadczenie
      ZDO i zaświadczenie o pobycie matki w szpitalu. Gdy płaci ZUS – także zaświadczenie płatnika Z-3 (etat) albo
      Z-3a (zlecenie). Przedsiębiorca składa wniosek prosto do ZUS, bez zaświadczenia płatnika. Zasiłek wypłaca
      pracodawca (ponad 20 ubezpieczonych) albo ZUS.'
