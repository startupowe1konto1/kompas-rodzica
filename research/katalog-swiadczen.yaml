  - do_3_miesiecy
  termin:
    od: poczatek_urlopu
    limit: co najmniej 7 dni przed rozpoczęciem urlopu
    skutek_spoznienia: Kodeks nie określa skutku spóźnienia. Urlop trzeba wykorzystać, zanim dziecko skończy 12
      miesięcy.
  kwota: null
  jak_zlozyc:
    kanaly:
    - pracodawca – na papierze
    - pracodawca – elektronicznie
    uwagi: Nie ma urzędowego formularza. Pismo w dowolnej formie, z treścią określoną w rozporządzeniu. Pracodawca
      musi uwzględnić wniosek.
  urzedowy_formularz: false
  tresc_wniosku:
  - Imię i nazwisko pracownika.
  - Okres, na który ma być udzielony urlop ojcowski albo jego część.
  zalaczniki:
  - Skrócony odpis aktu urodzenia dziecka albo zagraniczny dokument potwierdzający urodzenie (mogą być kopie).
  - Kopia prawomocnego postanowienia sądu o przysposobieniu – tylko przy dziecku przysposobionym.
  - Oświadczenie, czy korzystałeś już z urlopu ojcowskiego albo jego części.
  - Nie dołączasz dokumentów, które są już w twoich aktach osobowych.
  powiazane:
  - urlop_ojcowski
  - ochrona_przed_zwolnieniem
  podstawa_prawna: KP art. 182[3] § 1, § 1[1], § 2; rozp_2025 § 17, § 21–23
