- id: laczenie_urlopu_rodzicielskiego_z_praca
  nazwa: Łączenie urlopu rodzicielskiego z pracą na część etatu
  typ: uprawnienie
  instytucja: pracodawca
  dla_kogo:
    rola:
    - oboje
    status_zawodowy:
    - etat
    warunki:
    - Praca najwyżej na pół etatu, u pracodawcy, który udzielił urlopu rodzicielskiego. Urlopu udziela się na pozostałą
      część etatu.
    - Pracodawca musi się zgodzić, chyba że nie pozwala na to organizacja albo rodzaj pracy. Odmowę z przyczyną
      przekazuje w ciągu 7 dni od otrzymania wniosku.
    - Przepisy mówią tylko o pracowniku. Sytuacji osób na zleceniu i z działalnością ten rekord nie opisuje.
  etap: do_12_miesiecy
  termin:
    od: poczatek_urlopu
    limit: Wniosek u pracodawcy najpóźniej 21 dni przed rozpoczęciem pracy
    skutek_spoznienia: null
  kwota:
    opis: Zasiłek macierzyński zmniejsza się proporcjonalnie do wymiaru pracy (przy pół etatu – o połowę); za pracę
      pracownik dostaje wynagrodzenie. Za okres, o który urlop się wydłużył, zasiłek jest wypłacany w tej samej,
      obniżonej kwocie.
    wydluzenie_urlopu: 'Urlop wydłuża się o liczbę tygodni pracy pomnożoną przez wymiar etatu, na jaki pracujesz.
      Przykład wyliczony z tego wzoru: 8 tygodni pracy na pół etatu daje 4 dodatkowe tygodnie urlopu. Jeśli wynik
      nie jest pełnym tygodniem, resztę udziela się w dniach; niepełny dzień się pomija.'
    limit_lacznego_okresu:
      jedno_dziecko: 82 tygodnie
      wiecej_dzieci_przy_jednym_porodzie: 86 tygodni
      dziecko_z_zaswiadczeniem_za_zyciem_jedno: 130 tygodni
      dziecko_z_zaswiadczeniem_za_zyciem_wiecej_dzieci: 134 tygodnie
  jak_zlozyc:
    kanaly:
    - pracodawca
    uwagi: Wniosek w postaci papierowej lub elektronicznej. Podaje się w nim wymiar pracy, okres łączenia i sposób
      wykorzystania części, o którą urlop się wydłuży. Gdy zasiłek wypłaca ZUS, pracodawca wystawia zaświadczenie
      o okresie i wymiarze pracy w czasie urlopu.
