  - https://api.sejm.gov.pl/eli/acts/DU/1999/636/text/U/D19990636Lj.pdf
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Kwoty w złotych na 2026 r. – najniższa podstawa wymiaru składek (60% prognozowanego przeciętnego wynagrodzenia,
    preferencyjna 30% minimalnego), limit 250% i wysokość składki. Nie odczytano; nie wpisywać z pamięci.
  - Wysokość składki zdrowotnej w czasie zasiłku macierzyńskiego i ewentualne zwolnienie z niej przy niskim zasiłku
    – nie sprawdzono.
  - Prowadzenie działalności w czasie zasiłku macierzyńskiego – potwierdza to poradnik ZUS ze stanem prawnym na
    1.01.2023 i brak zakazu w ustawie; warto potwierdzić w aktualnym źródle.
  - Jak przerwa po spóźnionym ZUS ZUA wpływa na okres wyczekiwania na zasiłek chorobowy (art. 4 ust. 2 ustawy –
    przerwa do 30 dni nie szkodzi; okres pobierania zasiłku macierzyńskiego zalicza się do okresu wyczekiwania).
    Nie rozstrzygnięto – nie pokazywać bez potwierdzenia.
  - Mały ZUS plus – jak niższa podstawa składek wpływa na zasiłek (nie sprawdzano).
- id: porod_na_urlopie_wychowawczym
  nazwa: Poród kolejnego dziecka w czasie urlopu wychowawczego
  typ: swiadczenie
  instytucja: ZUS
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - etat
    warunki:
    - Zasiłek macierzyński przysługuje także wtedy, gdy dziecko urodzi się w czasie urlopu wychowawczego – mimo
      że na tym urlopie nie ma ubezpieczenia chorobowego.
    - Przysługuje zasiłek za okres urlopu macierzyńskiego i rodzicielskiego. Można wybrać 81,5% – wniosek w 21 dni
      po porodzie.
    - Zasiłek chorobowy i opiekuńczy w czasie urlopu wychowawczego nie przysługują – zwolnienie lekarskie w ciąży
      nie daje wtedy pieniędzy.
    - Za sam urlop wychowawczy zasiłek macierzyński nie przysługuje – prawo powstaje dopiero z dniem porodu.
  etap: porod_do_21_dni
  termin:
    od: porod
    limit: 21 dni na wybór wariantu 81,5%; wniosek o zasiłek za okres urlopu rodzicielskiego – przed pierwszym dniem
      tego okresu
    skutek_spoznienia: Po 21 dniach zostaje wariant 100% i 70%. Spóźniony wniosek o część rodzicielską – ZUS nie
      wypłaci zasiłku za ten okres, chyba że opóźnienie nie wynikało z winy matki.
  kwota:
    opis: 100% podstawy wymiaru za okres urlopu macierzyńskiego i 70% za rodzicielski albo 81,5% za oba okresy.
    podstawa: 'Jeśli przez całe 12 miesięcy przed porodem trwał urlop wychowawczy, podstawą jest wynagrodzenie za
      miesiąc porodu: stała miesięczna pensja z umowy o pracę albo – przy płacy zmiennej – kwota, którą pracownica
      zarobiłaby za pełny miesiąc; gdy nie da się jej ustalić, minimalne wynagrodzenie (proporcjonalnie do wymiaru
      etatu).'
    okres: Jak przy zwykłym zasiłku macierzyńskim (20–37 tygodni) i rodzicielskim (do 41 lub 43 tygodni).
    minimum: Dopłata do 1000 zł netto na ogólnych zasadach.
  jak_zlozyc:
    kanaly:
    - pracodawca
    - PUE/eZUS
    uwagi: Wniosek o zasiłek macierzyński (ZAM) z danymi dziecka. Kto wypłaca – pracodawca (ponad 20 ubezpieczonych)
      albo ZUS.
