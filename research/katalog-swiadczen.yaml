- id: wniosek_do_pracodawcy_urlop_macierzynski_rodzicielski
  nazwa: Wniosek do pracodawcy o urlop macierzyński i rodzicielski
  typ: formalnosc
  instytucja: pracodawca
  dla_kogo:
    rola:
    - matka
    status_zawodowy:
    - etat
    warunki:
    - Tylko pracownicy. Osoby na zleceniu i przedsiębiorcy nie biorą urlopu – składają w ZUS wniosek o zasiłek macierzyński.
  etap: porod_do_21_dni
  etapy_dodatkowe:
  - ciaza
  - do_3_miesiecy
  - do_12_miesiecy
  termin:
    od: poczatek_urlopu
    limit: Wniosek o urlop rodzicielski – co najmniej 21 dni przed rozpoczęciem urlopu.
    skutek_spoznienia: null
    szczegoly:
      urlop_macierzynski_po_porodzie: Bez wniosku. Urlop zaczyna się w dniu porodu. Zanieś pracodawcy skrócony odpis
        aktu urodzenia dziecka.
      urlop_macierzynski_przed_porodem: Do 6 tygodni przed przewidywaną datą porodu, na wniosek. Kodeks nie podaje
        terminu złożenia.
      urlop_rodzicielski: Co najmniej 21 dni przed rozpoczęciem urlopu albo jego części. Pracodawca musi uwzględnić
        wniosek.
      uzupelniajacy_urlop_macierzynski: Co najmniej 21 dni przed zakończeniem urlopu macierzyńskiego.
      wniosek_21_dni_po_porodzie: 'To osobna sprawa: wniosek o zasiłek macierzyński za urlop macierzyński i rodzicielski
        w pełnym wymiarze (81,5%), składany najpóźniej 21 dni po porodzie. Kodeks pracy nie przewiduje już łącznego
        wniosku o oba urlopy.

        '
    wykorzystanie_urlopu_rodzicielskiego: Jednorazowo albo najwyżej w 5 częściach, do końca roku kalendarzowego,
      w którym dziecko kończy 6 lat.
  kwota: null
  jak_zlozyc:
    kanaly:
    - pracodawca – na papierze
    - pracodawca – elektronicznie
    uwagi: 'Nie ma urzędowego formularza. To pismo w dowolnej formie; jego treść i załączniki określa rozporządzenie.
      Zapytaj pracodawcę, czy ma własny wzór.

      '
  urzedowy_formularz: false
  tresc_wniosku:
    urlop_macierzynski_przed_porodem:
    - Imię i nazwisko pracownicy.
    - Data, od której ma być udzielona część urlopu macierzyńskiego.
    urlop_rodzicielski:
    - Imię i nazwisko pracownika.
    - Okres dotychczas wykorzystanego urlopu rodzicielskiego lub zasiłku macierzyńskiego za okres tego urlopu.
    - Liczba wykorzystanych części urlopu rodzicielskiego lub liczba wniosków o zasiłek za część tego urlopu.
    - Okres, na który ma być udzielony urlop rodzicielski albo jego część.
    uzupelniajacy_urlop_macierzynski:
    - Imię i nazwisko pracownicy albo pracownika – ojca.
    - Termin zakończenia urlopu macierzyńskiego.
    - Okres, na który ma być udzielony uzupełniający urlop macierzyński.
    laczenie_urlopu_rodzicielskiego_z_praca:
    - Imię i nazwisko pracownika.
    - Wymiar czasu pracy (najwyżej połowa pełnego wymiaru).
    - Okres łączenia urlopu z pracą.
    - Oświadczenie, czy wydłużoną część urlopu też chcesz łączyć z pracą i w jakim wymiarze.
  zalaczniki:
    urlop_macierzynski_przed_porodem:
    - Kopia zaświadczenia lekarskiego z przewidywaną datą porodu (na zwykłym druku).
    urlop_rodzicielski:
    - Skrócony odpis aktu urodzenia dziecka albo zagraniczny dokument potwierdzający urodzenie (mogą być kopie).
    - Oświadczenie, że drugi rodzic nie będzie w tym okresie korzystać z urlopu rodzicielskiego ani zasiłku, albo
      w jakim okresie będzie.
    - Kopia zaświadczenia „Za życiem”, jeśli wniosek dotyczy wydłużonego urlopu (65 albo 67 tygodni).
    uzupelniajacy_urlop_macierzynski:
    - Zaświadczenie szpitala o okresie pobytu dziecka i o tygodniu ciąży oraz masie urodzeniowej.
    - Oświadczenie, że drugi rodzic nie zamierza korzystać z tego urlopu ani z zasiłku za jego okres.
    zasady_wspolne:
    - Nie dołączasz dokumentów, które są już w twoich aktach osobowych.
    - Jeśli dołączasz kopię, pracodawca może zażądać oryginału do wglądu.
    - Zagraniczny akt urodzenia składasz z tłumaczeniem na polski, chyba że wydano go w UE, EFTA, Szwajcarii albo
      państwie związanym z Polską umową o zabezpieczeniu społecznym.
  powiazane:
  - wybor_wariantu_81_5
  - zasilek_macierzynski_urlop_macierzynski
  - zasilek_macierzynski_urlop_rodzicielski
  - uzupelniajacy_urlop_macierzynski
  podstawa_prawna: KP art. 180 § 2; art. 180[2] § 4–6; art. 182[1c]; art. 182[1d]; art. 182[1e]; art. 183[1] § 2;
    art. 186[8a]; rozp_2025 § 2, § 14–16, § 21–23; u_zas art. 30a i art. 31 ust. 3
  zrodlo:
  - https://api.sejm.gov.pl/eli/acts/DU/2025/322/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2026/1245/text.pdf
  - https://api.sejm.gov.pl/eli/acts/DU/2026/854/text.pdf
  - https://www.gov.pl/web/gov/skorzystajcie-z-urlopow-rodzicielskich
  weryfikacja: czesciowo
  sprawdzono: 2026-11-20
  do_sprawdzenia:
  - Skutek złożenia wniosku o urlop rodzicielski później niż 21 dni przed urlopem – Kodeks tego nie reguluje (inaczej
    niż przy urlopie wychowawczym).
  - Komu i na jakim druku składa się wniosek o zasiłek z art. 30a, gdy zasiłek wypłaca ZUS, a nie pracodawca (formularze
    ZUS – część katalogu o zasiłkach).
  - Strona gov.pl (aktualizacja 25.09.2025) podaje 80% zasiłku; ustawa mówi 81,5%. W aplikacji używać wartości z
    ustawy.
  - Dokument, którym matka potwierdza poród u pracodawcy – gov.pl wskazuje skrócony odpis aktu urodzenia; rozporządzenie
    tego nie reguluje.
- id: wniosek_o_urlop_ojcowski
  nazwa: Wniosek do pracodawcy o urlop ojcowski
  typ: formalnosc
  instytucja: pracodawca
  dla_kogo:
    rola:
    - ojciec
    status_zawodowy:
    - etat
    warunki:
    - Tylko pracownicy. Nie dotyczy zlecenia, umowy o dzieło ani działalności gospodarczej.
    - Urlop do 2 tygodni, do ukończenia przez dziecko 12. miesiąca życia.
    - Jednorazowo albo w 2 częściach, każda co najmniej tygodniowa.
    - Przy adopcji – do 12 miesięcy od uprawomocnienia się postanowienia o przysposobieniu, najdłużej do 14. roku
